name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write   # needed for cancel-in-progress concurrency

# Cancel any in-progress run for the same branch/PR the moment a newer push
# arrives.  PRs and branch pushes each get their own concurrency group so they
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # Disable incremental compilation for reproducible CI builds
  RUST_BACKTRACE: short
  # Use sqlx offline cache for compile-time query checks in CI.
  SQLX_OFFLINE: true

jobs:
  # ── 1. Formatting ──────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ── 2. SQLx offline cache integrity ──────────────────────────────────────────
  # Verifies the committed .sqlx query cache covers every sqlx::query! call,
  # including those inside #[cfg(test)] blocks (-- --all-targets is required).
  # A stale cache produces cryptic SQLX_OFFLINE compile errors in the clippy
  # and coverage jobs.  This job surfaces the real cause up front with a clear
  # message.
  #
  # Fix when this fails: run the following locally and commit the .sqlx/ changes:
  #   cargo sqlx prepare --workspace -- --all-targets
  # Note: --check must come before -- so sqlx-cli sees it, not cargo check.
  sqlx-check:
    name: SQLx Cache Check
    runs-on: ubuntu-latest
    env:
      STITCHD_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stitchd_test
      # sqlx-cli requires DATABASE_URL; set it as an alias for STITCHD_DATABASE_URL
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stitchd_test
      SQLX_OFFLINE: false
    steps:
      - uses: actions/checkout@v4

      - name: Start postgres
        run: POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=stitchd_test docker compose up postgres -d --wait --wait-timeout 120

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Proto files are compiled by build.rs; a proto change must bust
          # the build cache even when Cargo.lock is unchanged.
          key: proto-${{ hashFiles('proto/**/*.proto', 'sdks/spec/proto/**/*.proto') }}

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations
        run: sqlx migrate run --source crates/stitchd-db/migrations

      - name: Verify SQLx offline cache is current (all targets incl. tests)
        # --features stitchd-sdk-rust/test-util is required so test targets
        # that import client::testing (e.g. e2e_cross_context_hashing.rs,
        # parity_with_preview.rs) compile under --all-targets.
        run: cargo sqlx prepare --workspace --check -- --all-targets --features stitchd-sdk-rust/test-util

  # ── 3. Linting ─────────────────────────────────────────────────────────────
  # Clippy depends on every upstream gate: fmt (formatting must be clean first
  # since clippy will not run on unformatted code in some configurations),
  # sqlx-check (offline cache must cover all queries before clippy compiles
  # them), and contract-check (catches REST contract drift cheap before clippy
  # spends 5+ minutes compiling).
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [fmt, sqlx-check, contract-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: proto-${{ hashFiles('proto/**/*.proto', 'sdks/spec/proto/**/*.proto') }}

      - name: Run Clippy
        # SDK crate is `stitchd-sdk-rust` (renamed during sdk_rewrite_20260516).
        # The `test-util` feature gates conformance-test helpers — needed for
        # `--all-targets` to compile the conformance integration test.
        run: cargo clippy --workspace --all-targets --features stitchd-sdk-rust/test-util -- -D warnings

  # ── 4. API contract check ──────────────────────────────────────────────────
  # Ensures no REST routes present in the pre-decomposition OpenAPI snapshot
  # are silently dropped by the gateway (exits non-zero on unexpected gaps).
  contract-check:
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify gateway covers pre-decomposition API surface
        run: python3 scripts/check_openapi_contract.py

  # ── 5. Tests + Coverage ────────────────────────────────────────────────────
  # cargo-llvm-cov runs tests AND instruments for coverage in a single pass
  # across the entire workspace, producing a single cobertura.xml uploaded to
  # Codecov.  llvm-tools-preview is required by cargo-llvm-cov.
  #
  # Only the infrastructure services (postgres, clickhouse) are started here.
  # The six microservice containers require built Docker images and are exercised
  # by the E2E Step CI workflows (tests/e2e/) against a live stack, not in CI.
  coverage:
    name: Coverage (≥90%)
    runs-on: ubuntu-latest
    # Coverage is the heavy job (runs the entire test suite with instrumentation
    # + uploads to Codecov, ~6–10 min on a clean cache). Gate it behind every
    # cheaper check so we don't burn runner minutes when fmt / sqlx-check /
    # contract-check / clippy will reject the change anyway.
    needs: [fmt, sqlx-check, contract-check, clippy]
    env:
      STITCHD_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stitchd_test
      # `#[sqlx::test]` reads the plain `DATABASE_URL` env var, not the
      # canonical `STITCHD_DATABASE_URL`. Mirror the value here so any
      # sqlx-annotated tests (e.g. analytics-service metric handler
      # integration tests added in events_metrics_20260519) can spin up
      # their per-test isolated DBs. See conductor/patterns.md gotcha
      # "`STITCHD_DATABASE_URL` vs `DATABASE_URL`".
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stitchd_test
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure services
        run: POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=stitchd_test docker compose up postgres clickhouse -d --wait --wait-timeout 120

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: proto-${{ hashFiles('proto/**/*.proto', 'sdks/spec/proto/**/*.proto') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests + coverage (workspace)
        # SDK crate is `stitchd-sdk-rust` (renamed during sdk_rewrite_20260516);
        # `--features stitchd-sdk-rust/test-util` exposes conformance test
        # helpers so `--all-targets` (implicit under `cargo llvm-cov`) builds.
        run: |
          mkdir -p coverage
          cargo llvm-cov \
            --workspace \
            --exclude stitchd-proto \
            --exclude xtask \
            --features stitchd-sdk-rust/test-util \
            --ignore-filename-regex 'main\.rs' \
            --cobertura \
            --output-path coverage/cobertura.xml

      - name: Live-ClickHouse integration tests (stats-service)
        # The query builders, per-metric compute pass, CUPED, percentile and
        # interaction SQL are only exercised by `#[ignore]`d live-ClickHouse tests,
        # which `cargo llvm-cov` above does not run (no `-- --ignored`). ClickHouse
        # is already up from "Start infrastructure services" and these tests are
        # self-contained (they call `event_writer::migrations::run` to create
        # their tables and default `STITCHD_CLICKHOUSE_URL` to localhost), so run
        # them explicitly here to guard the join semantics + ITT bounding.
        # NOTE: list each `--test` target explicitly (a plain `-- --ignored` would
        # also run non-self-seeding ignored tests); keep this in sync with the
        # self-seeding files under crates/stitchd-stats-service/tests/.
        run: |
          cargo test -p stitchd-stats-service \
            --test aggregation_query --test ratio_query --test funnel_query \
            --test preview_query --test interaction_compute --test compute_pass \
            --test cuped_compute --test percentile_significance -- --ignored

      - name: Upload coverage to Codecov
        # Use the official `codecov/codecov-action` instead of the
        # legacy uploader-bash flow. The action:
        #   - Handles 404 "Repository not found" with a clear warning
        #     (the previous bash uploader hit this because the repo
        #     isn't onboarded on codecov.io yet; the upload silently
        #     swallowed the response and exited 0).
        #   - Skips silently when the token is missing (no error in
        #     forks / untrusted PRs).
        #   - Auto-discovers cobertura reports via the `files:` glob.
        # `fail_ci_if_error: false` keeps a Codecov-side outage from
        # turning a green test pass into a red build. Flip to true once
        # the repo is onboarded if you want strict coverage gating.
        #
        # **One-time setup required outside this repo:**
        # Sign in to https://codecov.io with the GitHub org admin,
        # add the `stitchd-dev/feature-flag` repo, copy the upload
        # token, and set it as the `CODECOV_TOKEN` secret on this repo.
        # Until that's done these uploads land at /upload/v4 and get
        # `Repository not found` from Codecov.
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: coverage/cobertura.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload coverage reports as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── 5b. Admin frontend tests + coverage ────────────────────────────────────
  # Runs the Vitest suite under `admin/` and uploads its coverage report
  # to Codecov as a separate flag so the React/TypeScript surface is
  # tracked alongside the Rust workspace. No threshold is enforced —
  # most admin pages are React components without direct unit tests
  # (logic lives in `*.test.ts` mirror functions), so a percentage
  # gate would block legitimate PRs. The job's value is: (a) any
  # broken Vitest test fails the build, (b) Codecov gets a snapshot of
  # what IS covered for trend visibility.
  admin-frontend:
    name: Admin Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # `tsc -b` is the project's standard typecheck (also runs in
        # `npm run build`). Cheaper than running Vite build and gives
        # a fast TypeScript-only signal.
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test + coverage
        # Vitest's v8 coverage with `reporter: ['cobertura', ...]`
        # emits `admin/coverage/cobertura-coverage.xml` — note the
        # `-coverage` suffix, NOT plain `cobertura.xml`. The Codecov
        # upload below points at the correct filename.
        run: npm run test:coverage

      - name: Upload admin coverage to Codecov
        # Switched from legacy uploader-bash to the official
        # `codecov/codecov-action` for cleaner error handling and
        # automatic skip when the token is empty (forks / untrusted
        # PRs). Tagged with `flags: admin` so the React surface stays
        # separable from the Rust workspace report on Codecov.
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          # `working-directory: admin` applies to `run:` steps via the
          # job defaults, but `uses:` actions run from the repo root —
          # the full repo-relative path is required here.
          files: admin/coverage/cobertura-coverage.xml
          flags: admin
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-admin
          path: admin/coverage/
          retention-days: 7

  # ── 6. Docs build + idempotency + link-check ───────────────────────────────
  # `cargo xtask docs` is idempotent by contract — re-running on already-
  # generated output produces zero diff. Step 7 below enforces that contract
  # in CI by running xtask and then `git diff --exit-code` on the workspace.
  # If a developer hand-edits a generator-owned file (anything under
  # docs/src/grpc/ except README.md, docs/src/deployment/env-vars.md,
  # docs/src/sdk/quickstart.md, docs/src/api/openapi.json, or any
  # crates/*/README.md or sdks/rust/README.md), the next CI run for their PR
  # will fail at the `git diff` step.
  #
  # The link-check step (broken internal markdown links fail the build) runs
  # *inside* `cargo xtask docs` — see `check_internal_links()` in
  # crates/xtask/src/main.rs. Custom in-xtask implementation chosen because
  # mdbook-linkcheck 0.7 is incompatible with mdbook 0.5.x.
  docs-build:
    name: Docs Build (idempotent + link-check)
    runs-on: ubuntu-latest
    # Docs is the last gate — runs only after both the Rust test suite AND the
    # admin frontend suite have signed off so a failing Vitest run can't slip
    # past into a docs deploy.
    needs: [coverage, admin-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: proto-${{ hashFiles('proto/**/*.proto', 'sdks/spec/proto/**/*.proto') }}

      - name: Install xtask-managed CLI tools
        # xtask auto-installs missing tools via `cargo install` at runtime, but
        # pre-installing them as a separate step makes failures easy to read,
        # benefits from `Swatinem/rust-cache` across PR runs, and lets us pin
        # cargo-rdme. The unpinned `cargo-rdme` recipe in taiki-e's registry
        # has resolved to versions that segfault on this workspace's analytics-
        # service crate (observed in the docs_refresh_20260522 archive run).
        # Pinning to ^1.5 matches the version the xtask was built against and
        # matches `[package.metadata.xtask-tools]` in crates/xtask/Cargo.toml.
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid,cargo-rdme@1.5

      - name: Build docs (also runs internal-link check)
        run: cargo run --manifest-path crates/xtask/Cargo.toml -- docs

      - name: Assert generators are idempotent (no drift)
        # If this step fails, a generator-owned file was hand-edited. To fix:
        # change the source-of-truth (//! preamble, STITCHD_* declaration,
        # .proto file, or sdks/rust/src/lib.rs # Quickstart section) instead.
        run: |
          if ! git diff --exit-code; then
            echo ""
            echo "::error::cargo xtask docs produced a diff against the committed state."
            echo "::error::A generator-owned file was hand-edited. Move the change into the source-of-truth."
            echo "::error::See conductor/workflow.md 'Before Committing' for details."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: docs/book/

  # ── 7. Deploy to GitHub Pages ───────────────────────────────────────────────
  docs-deploy:
    name: Deploy Docs to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
