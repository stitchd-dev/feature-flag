name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write   # needed by detect-changes to query run history and cancel in-progress runs

# Cancel any in-progress run for the same branch/PR the moment a newer push
# arrives.  PRs and branch pushes each get their own concurrency group so they
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # Disable incremental compilation for reproducible CI builds
  RUST_BACKTRACE: short
  # Use sqlx offline cache for compile-time query checks in CI.
  SQLX_OFFLINE: true

jobs:
  # ── 0. Changed-crate detection ─────────────────────────────────────────────
  # Runs before tests and coverage to compute which workspace crates (and their
  # transitive dependents) are affected by this push/PR.  fmt, clippy, and docs
  # always run at workspace level and are not gated on this output.
  detect-changes:
    name: Detect Changed Crates
    runs-on: ubuntu-latest
    outputs:
      test-packages: ${{ steps.compute.outputs.test-packages }}
      crate-names:   ${{ steps.compute.outputs.crate-names }}
      has-changes:   ${{ steps.compute.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history to diff against the previous push/PR base.
          fetch-depth: 0

      - name: Compute affected crates
        id: compute
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BEFORE:   ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH:   ${{ github.ref_name }}
          WORKFLOW: ci.yml
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/affected_crates.py

  # ── 1. Formatting ──────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ── 2. Linting ─────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 3. Tests ───────────────────────────────────────────────────────────────
  # Runs only for crates affected by this push/PR (direct changes + their
  # transitive dependents).  Skipped entirely when no testable crate changed.
  test:
    name: Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stitchd_test
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=stitchd_test docker compose up -d --wait --wait-timeout 120

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests (${{ needs.detect-changes.outputs.crate-names }})
        run: cargo test ${{ needs.detect-changes.outputs.test-packages }}

  # ── 4. Coverage ────────────────────────────────────────────────────────────
  # Runs tarpaulin once per affected crate and uploads each result to Codecov
  # under its own flag.  Unchanged crates are filled in via Codecov's
  # carryforward feature (see codecov.yml), so the global project % stays
  # accurate even though only a subset of crates ran.
  coverage:
    name: Coverage (≥90%)
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stitchd_test
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=stitchd_test docker compose up -d --wait --wait-timeout 120

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage per affected crate
        env:
          CRATE_NAMES: ${{ needs.detect-changes.outputs.crate-names }}
        run: |
          mkdir -p coverage
          for crate in $CRATE_NAMES; do
            echo "── coverage: $crate ──"
            mkdir -p "coverage/$crate"
            cargo tarpaulin \
              -p "$crate" \
              --timeout 120 \
              --out Xml \
              --output-dir "coverage/$crate/" \
              --exclude-files "crates/stitchd-proto/*" \
              --exclude-files "crates/xtask/*"
          done

      - name: Upload per-crate coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CRATE_NAMES:   ${{ needs.detect-changes.outputs.crate-names }}
        run: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          for crate in $CRATE_NAMES; do
            xml="coverage/$crate/cobertura.xml"
            if [ -f "$xml" ]; then
              echo "── uploading: $crate (flag=$crate) ──"
              ./codecov \
                --token="$CODECOV_TOKEN" \
                --file="$xml" \
                --flag="$crate" \
                --fail-on-error
            fi
          done

      - name: Upload coverage reports as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── 5. Docs build ──────────────────────────────────────────────────────────
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo run --manifest-path crates/xtask/Cargo.toml -- docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: docs/book/

  # ── 6. Deploy to GitHub Pages ───────────────────────────────────────────────
  docs-deploy:
    name: Deploy Docs to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
