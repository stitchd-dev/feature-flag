name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write   # needed by detect-changes to query run history and cancel in-progress runs

# Cancel any in-progress run for the same branch/PR the moment a newer push
# arrives.  PRs and branch pushes each get their own concurrency group so they
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # Disable incremental compilation for reproducible CI builds
  RUST_BACKTRACE: short
  # Use sqlx offline cache for compile-time query checks in CI.
  SQLX_OFFLINE: true

jobs:
  # ── 0. Changed-crate detection ─────────────────────────────────────────────
  # Runs before tests and coverage to compute which workspace crates (and their
  # transitive dependents) are affected by this push/PR.  fmt, clippy, and docs
  # always run at workspace level and are not gated on this output.
  detect-changes:
    name: Detect Changed Crates
    runs-on: ubuntu-latest
    outputs:
      test-packages: ${{ steps.compute.outputs.test-packages }}
      crate-names:   ${{ steps.compute.outputs.crate-names }}
      has-changes:   ${{ steps.compute.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history to diff against the previous push/PR base.
          fetch-depth: 0

      - name: Compute affected crates
        id: compute
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BEFORE:   ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH:   ${{ github.ref_name }}
          WORKFLOW: ci.yml
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/affected_crates.py

  # ── 1. Formatting ──────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ── 2. Linting ─────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 3. API contract check ──────────────────────────────────────────────────
  # Ensures no REST routes present in the pre-decomposition OpenAPI snapshot
  # are silently dropped by the gateway (exits non-zero on unexpected gaps).
  contract-check:
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify gateway covers pre-decomposition API surface
        run: python3 scripts/check_openapi_contract.py

  # ── 4. Tests + Coverage ────────────────────────────────────────────────────
  # Tarpaulin runs tests AND instruments for coverage in a single pass, so
  # there is no separate test job.  Running them together avoids compiling the
  # affected crates twice (once for tests, once for coverage instrumentation).
  #
  # All affected crates are passed to one tarpaulin invocation, producing a
  # single cobertura.xml.  That file is then uploaded to Codecov once per
  # affected crate flag; codecov.yml's per-flag `paths:` scoping ensures each
  # flag only counts coverage from its own crate directory.  Unchanged crates
  # are filled in via Codecov's carryforward feature (see codecov.yml).
  #
  # Only the infrastructure services (postgres, clickhouse) are started here.
  # The six microservice containers require built Docker images and are exercised
  # by the E2E Step CI workflows (tests/e2e/) against a live stack, not in CI.
  coverage:
    name: Coverage (≥90%)
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stitchd_test
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure services
        run: POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=stitchd_test docker compose up postgres clickhouse -d --wait --wait-timeout 120

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run tests + coverage (${{ needs.detect-changes.outputs.crate-names }})
        env:
          CRATE_NAMES: ${{ needs.detect-changes.outputs.crate-names }}
        run: |
          mkdir -p coverage
          # Build "-p crate1 -p crate2 ..." from the space-separated crate list.
          PKGS=$(echo "$CRATE_NAMES" | tr ' ' '\n' | sed 's/^/-p /' | xargs)
          cargo tarpaulin \
            $PKGS \
            --timeout 120 \
            --out Xml \
            --output-dir coverage/ \
            --exclude-files "crates/stitchd-proto/*" \
            --exclude-files "crates/xtask/*"

      - name: Upload per-crate coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CRATE_NAMES:   ${{ needs.detect-changes.outputs.crate-names }}
        run: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          xml="coverage/cobertura.xml"
          if [ ! -f "$xml" ]; then
            echo "No coverage report generated — skipping upload"
            exit 0
          fi
          # Upload the combined XML once per affected crate flag.
          # codecov.yml's per-flag `paths:` scoping ensures each flag only
          # counts lines from its own crate directory.
          for crate in $CRATE_NAMES; do
            echo "── uploading: $crate (flag=$crate) ──"
            ./codecov \
              --token="$CODECOV_TOKEN" \
              --slug="$GITHUB_REPOSITORY" \
              --file="$xml" \
              --flag="$crate" \
              --fail-on-error
          done

      - name: Upload coverage reports as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── 5. Docs build ──────────────────────────────────────────────────────────
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo run --manifest-path crates/xtask/Cargo.toml -- docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: docs/book/

  # ── 6. Deploy to GitHub Pages ───────────────────────────────────────────────
  docs-deploy:
    name: Deploy Docs to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
