[workspace]
resolver = "3"
members = [
    "crates/stitchd-core",
    "crates/stitchd-db",
    "crates/stitchd-events",
    "crates/stitchd-proto",
    "crates/stitchd-sdk",
    "crates/stitchd-server",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Stitchd"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web / gRPC
axum = { version = "0.8", features = ["macros"] }
tonic = { version = "0.13" }
tonic-build = { version = "0.13" }
prost = { version = "0.13" }
prost-build = { version = "0.13" }
protoc-bin-vendored = { version = "3" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# OpenAPI
utoipa = { version = "5", features = ["uuid", "chrono"] }
utoipa-axum = { version = "0.2" }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
clickhouse = { version = "0.13", features = ["uuid", "time", "lz4"] }

# Observability
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.29" }
opentelemetry = { version = "0.28" }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["tonic"] }
opentelemetry-semantic-conventions = { version = "0.28" }
metrics = { version = "0.24" }
metrics-exporter-prometheus = { version = "0.16" }

# Error handling
thiserror = { version = "2" }
anyhow = { version = "1" }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
smallvec = { version = "1" }
bytes = { version = "1" }
async-trait = { version = "0.1" }
siphasher = { version = "1" }
murmur3 = { version = "0.5" }
sha2 = { version = "0.10" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
openidconnect = { version = "3", features = ["reqwest"] }
url = { version = "2" }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = "9"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
quick-xml = { version = "0.36", features = ["serialize"] }
flate2 = "1"
