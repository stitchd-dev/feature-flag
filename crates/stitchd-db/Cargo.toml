[package]
name = "stitchd-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
tonic = ["dep:tonic"]
test-fixtures = []

[dependencies]
stitchd-core = { path = "../stitchd-core" }
scylla = { workspace = true }
sqlx = { workspace = true }
clickhouse = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# Opaque keyset-cursor tokens for list pagination (feature-flag-cj5).
base64 = { workspace = true }
metrics = { workspace = true }
tonic = { version = "0.14", optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# E2E tests under tests/event_metric_e2e.rs need the metric dispatcher
# (stats-service) and the embedded CH migration runner (event-writer).
# Both are workspace siblings, so dev-only paths are cheap.
stitchd-stats-service = { path = "../stitchd-stats-service" }
stitchd-event-writer = { path = "../stitchd-event-writer" }