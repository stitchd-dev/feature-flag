[package]
name = "stitchd-experimentation-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "stitchd-experimentation-service"
path = "src/main.rs"

[dependencies]
stitchd-core = { path = "../stitchd-core" }
stitchd-db = { path = "../stitchd-db", features = ["tonic"] }
stitchd-proto = { path = "../stitchd-proto" }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
prost = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
async-trait = { workspace = true }
clickhouse = { workspace = true }
tokio-stream = { version = "0.1" }
futures-core = { version = "0.3" }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
# Phase 11 Task 11.2: experiment_lifecycle_e2e.rs drives PG + CH directly to
# exercise the eval-log -> experiment_assignments_mv -> stats pipeline.
# stitchd-db re-exports clickhouse::EvalLogRow + insert_eval_log_rows used by
# the test; stitchd-event-writer is the embedded CH migration runner.
stitchd-event-writer = { path = "../stitchd-event-writer" }