[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
stitchd-db = { path = "../stitchd-db" }

# mdbook and mdbook-mermaid are invoked as subprocesses.
# xtask auto-installs them via `cargo install` if absent from PATH.
# Pinning versions here ensures reproducible builds.
[package.metadata.xtask-tools]
mdbook = "0.5"
mdbook-mermaid = "0.17"