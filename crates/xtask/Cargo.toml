[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
stitchd-db = { path = "../stitchd-db" }
# Phase 3 of flag_eval_unify_20260522: `verify-hash-cutover` subcommand
# re-hashes legacy + new percentage-rule shapes against a fixture corpus,
# pulling `calculate_allocation` from stitchd-core. serde_json reads the
# fixture file.
stitchd-core = { path = "../stitchd-core" }
serde = { workspace = true }
serde_json = { workspace = true }

# mdbook and mdbook-mermaid are invoked as subprocesses.
# xtask auto-installs them via `cargo install` if absent from PATH.
# Pinning versions here ensures reproducible builds.
[package.metadata.xtask-tools]
mdbook = "0.5"
mdbook-mermaid = "0.17"