services:
  postgres:
    image: postgres:16-alpine
    container_name: stitchd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stitchd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stitchd}
      POSTGRES_DB: ${POSTGRES_DB:-stitchd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stitchd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stitchd} -d ${POSTGRES_DB:-stitchd}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  scylladb:
    image: scylladb/scylla:6.2
    container_name: stitchd-scylladb
    restart: unless-stopped
    command: --smp 1 --memory 512M --overprovisioned 1 --developer-mode 1
    ports:
      - "${SCYLLA_CQL_PORT:-9042}:9042"
    volumes:
      - scylladb_data:/var/lib/scylla
    networks:
      - stitchd
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: stitchd-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-stitchd}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-stitchd}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-stitchd}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # Native (TCP) interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./docker/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    networks:
      - stitchd
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── Microservices ──────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: docker/auth-service/Dockerfile
    container_name: stitchd-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stitchd}:${POSTGRES_PASSWORD:-stitchd}@postgres:5432/${POSTGRES_DB:-stitchd}
      AUTH_SERVICE_PORT: "50051"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@stitchd.io}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-changeme}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${AUTH_SERVICE_PORT:-50051}:50051"
    networks:
      - stitchd
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=:50051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flag-service:
    build:
      context: .
      dockerfile: docker/flag-service/Dockerfile
    container_name: stitchd-flag-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stitchd}:${POSTGRES_PASSWORD:-stitchd}@postgres:5432/${POSTGRES_DB:-stitchd}
      FLAG_SERVICE_PORT: "50052"
      ANALYTICS_SERVICE_ADDR: http://analytics-service:50054
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${FLAG_SERVICE_PORT:-50052}:50052"
    networks:
      - stitchd
    depends_on:
      postgres:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=:50052 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  segmentation-service:
    build:
      context: .
      dockerfile: docker/segmentation-service/Dockerfile
    container_name: stitchd-segmentation-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stitchd}:${POSTGRES_PASSWORD:-stitchd}@postgres:5432/${POSTGRES_DB:-stitchd}
      SCYLLA_URI: scylladb:9042
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-stitchd}
      SEGMENTATION_SERVICE_PORT: "50053"
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${SEGMENTATION_SERVICE_PORT:-50053}:50053"
    networks:
      - stitchd
    depends_on:
      postgres:
        condition: service_healthy
      scylladb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=:50053 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  experimentation-service:
    build:
      context: .
      dockerfile: docker/experimentation-service/Dockerfile
    container_name: stitchd-experimentation-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stitchd}:${POSTGRES_PASSWORD:-stitchd}@postgres:5432/${POSTGRES_DB:-stitchd}
      FLAG_SERVICE_ADDR: http://flag-service:50052
      EXPERIMENTATION_SERVICE_PORT: "50055"
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${EXPERIMENTATION_SERVICE_PORT:-50055}:50055"
    networks:
      - stitchd
    depends_on:
      postgres:
        condition: service_healthy
      flag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=:50055 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  stats-service:
    build:
      context: .
      dockerfile: docker/stats-service/Dockerfile
    container_name: stitchd-stats-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stitchd}:${POSTGRES_PASSWORD:-stitchd}@postgres:5432/${POSTGRES_DB:-stitchd}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-stitchd}:${CLICKHOUSE_PASSWORD:-stitchd}@clickhouse:8123/${CLICKHOUSE_DB:-stitchd}
      STATS_SERVICE_PORT: "50056"
      STATS_HTTP_PORT: "9200"
      SCHEDULER_INTERVAL_SECS: "3600"
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${STATS_SERVICE_PORT:-50056}:50056"
      - "${STATS_HTTP_PORT:-9200}:9200"
    networks:
      - stitchd
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=:50056 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics-service:
    build:
      context: .
      dockerfile: docker/analytics-service/Dockerfile
    container_name: stitchd-analytics-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stitchd}:${POSTGRES_PASSWORD:-stitchd}@postgres:5432/${POSTGRES_DB:-stitchd}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-stitchd}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-stitchd}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-stitchd}
      ANALYTICS_GRPC_PORT: "50054"
      METRICS_PORT: "9104"
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${ANALYTICS_SERVICE_PORT:-50054}:50054"
      - "${ANALYTICS_METRICS_PORT:-9104}:9104"
    networks:
      - stitchd
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=:50054 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: stitchd-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: "8080"
      METRICS_PORT: "9080"
      AUTH_SERVICE_ADDR: http://auth-service:50051
      FLAG_SERVICE_ADDR: http://flag-service:50052
      SEGMENTATION_SERVICE_ADDR: http://segmentation-service:50053
      ANALYTICS_SERVICE_ADDR: http://analytics-service:50054
      EXPERIMENTATION_SERVICE_ADDR: http://experimentation-service:50055
      STATS_SERVICE_ADDR: http://stats-service:50056
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${GATEWAY_METRICS_PORT:-9080}:9080"
    networks:
      - stitchd
    depends_on:
      auth-service:
        condition: service_healthy
      flag-service:
        condition: service_healthy
      segmentation-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      experimentation-service:
        condition: service_healthy
      stats-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin:
    build:
      context: ./admin
    container_name: stitchd-admin
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - stitchd
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  scylladb_data:
    driver: local

networks:
  stitchd:
    driver: bridge
