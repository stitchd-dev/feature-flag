services:
  postgres:
    image: postgres:16-alpine
    container_name: stitchd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stitchd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stitchd}
      POSTGRES_DB: ${POSTGRES_DB:-stitchd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stitchd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stitchd} -d ${POSTGRES_DB:-stitchd}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: stitchd-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-stitchd}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-stitchd}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-stitchd}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # Native (TCP) interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./docker/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    networks:
      - stitchd
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local

networks:
  stitchd:
    driver: bridge
