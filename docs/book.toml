[book]
title = "Stitchd Feature Flag"
authors = ["Stitchd"]
description = "API reference, SDK guide, deployment, and architecture documentation for Stitchd Feature Flag."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
git-repository-url = "https://github.com/stitchd-dev/feature-flag"
edit-url-template = "https://github.com/stitchd-dev/feature-flag/edit/main/docs/{path}"
no-section-label = false
additional-js = ["mermaid.min.js", "mermaid-init.js"]
