syntax = "proto3";

package stitchd.auth.v1;

// ─── Credential request ───────────────────────────────────────────────────────

// A raw credential presented by a caller for validation.
// Exactly one field must be set.
message CredentialRequest {
  oneof credential {
    // A signed JWT issued by the human-auth flow.
    string bearer_token = 1;
    // A raw SDK key presented via `x-sdk-key` header.
    string sdk_key      = 2;
  }
}

// ─── RBAC context ─────────────────────────────────────────────────────────────

// Access-control information returned for a validated credential.
// Downstream services inject this into request context without re-validating.
message RbacContext {
  string          tenant_id      = 1;
  string          environment_id = 2;
  repeated string roles          = 3;
  repeated string permissions    = 4;
  // The resolved actor identity (user_id for JWT, sdk_key_id for SDK keys).
  string          subject        = 5;
  // True when the credential belongs to a user in the platform System org.
  // Used by the gateway to enforce admin-only vs. management-only route
  // separation: admin routes require is_system=true; management routes
  // require is_system=false.
  bool            is_system      = 6;
}

// ─── Login request / response ─────────────────────────────────────────────────

message LoginRequest {
  string email    = 1;
  string password = 2;
  // Optional org scope; if empty the first org the user belongs to is used.
  string org_id   = 3;
}

message LoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
  // Seconds until the access token expires.
  int64  expires_in    = 3;
  string user_id       = 4;
  string org_id        = 5;
}

// ─── Org switching ────────────────────────────────────────────────────────────

message SwitchOrgRequest {
  string current_token = 1;
  string target_org_id = 2;
}

message SwitchOrgResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3;
  string org_id        = 4;
}

message UserOrgEntry {
  string org_id   = 1;
  string org_name = 2;
  string role     = 3;
}

message ListUserOrgsRequest {
  string current_token = 1;
}

message ListUserOrgsResponse {
  repeated UserOrgEntry orgs = 1;
}

// ─── Auth service ─────────────────────────────────────────────────────────────

service AuthService {
  // Validates a credential and returns the RBAC context for the caller.
  // Returns UNAUTHENTICATED if the credential is invalid or expired.
  rpc ValidateCredential(CredentialRequest) returns (RbacContext);

  // Authenticates an email + password credential and issues a JWT.
  rpc LoginWithPassword(LoginRequest) returns (LoginResponse);

  // Switches the current user to a different org, issuing a new JWT.
  rpc SwitchOrg(SwitchOrgRequest) returns (SwitchOrgResponse);

  // Lists all orgs the current user is a member of (excluding System orgs).
  rpc ListUserOrgs(ListUserOrgsRequest) returns (ListUserOrgsResponse);
}
