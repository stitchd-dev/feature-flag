syntax = "proto3";

package stitchd.events.v1;

// --- Metric value types ---

message MetricValue {
  oneof value {
    bool   bool_value   = 1;
    int64  int_value    = 2;
    double double_value = 3;
  }
}

// --- Event ---

// A single metric event emitted by the client SDK.
// Only pre-registered event keys with known types are accepted.
message Event {
  // The registered event key.
  string metric_key           = 1;
  // Minimal context: type + key only (no parameters — not needed for events).
  string context_type         = 2;
  string context_key          = 3;
  // The metric value — must match the registered type for this metric_key.
  MetricValue value           = 4;
  // Client-side timestamp in epoch milliseconds.
  int64 timestamp_ms          = 5;
}

// --- Ingest service ---

message IngestRequest {
  repeated Event events = 1;
}

message IngestResponse {
  // Number of events accepted (unknown keys are rejected and not counted).
  uint32 accepted_count = 1;
  // Keys that were rejected (not pre-registered or type mismatch).
  repeated string rejected_keys = 2;
}

service EventService {
  // Ingests a batch of metric events.
  // SDK key is supplied via gRPC metadata header `x-sdk-key`.
  rpc Ingest(IngestRequest) returns (IngestResponse);
}
