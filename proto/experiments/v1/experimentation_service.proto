syntax = "proto3";

package stitchd.experiments.v1;

// ─── Experiment status ────────────────────────────────────────────────────────

enum ExperimentStatus {
  EXPERIMENT_STATUS_UNSPECIFIED = 0;
  EXPERIMENT_STATUS_DRAFT       = 1;
  EXPERIMENT_STATUS_ACTIVE      = 2;
  EXPERIMENT_STATUS_PAUSED      = 3;
  EXPERIMENT_STATUS_CONCLUDED   = 4;
}

// ─── Experiment definition ────────────────────────────────────────────────────

message Experiment {
  string           id                   = 1;
  string           environment_id       = 2;
  string           name                 = 3;
  string           description          = 4;
  string           flag_key             = 5;
  ExperimentStatus status               = 6;
  repeated string  variant_keys         = 7;
  int64            created_at_ms        = 8;
  int64            updated_at_ms        = 9;
  uint64           version              = 10;
  // Binding fields (previously missing — BUG-025)
  string           flag_id              = 11;
  string           flag_rule_id         = 12;  // empty string = targets_default_rule
  bool             targets_default_rule = 13;
  repeated string  unit_context_types   = 14;
  repeated string  guardrail_metric_ids = 15;
  uint32           pre_period_days      = 16;
  // Metric definition UUIDs attached to this experiment.
  repeated string  metric_ids           = 17;
  // [ADDITIVE] Mutually-exclusive group membership. When set, this experiment
  // shares a disjoint slice of group traffic with other experiments in the
  // same group. `group_bucket_lo`/`group_bucket_hi` define the assigned
  // [lo, hi) bucket range within the group's salted hash space.
  optional string  exclusion_group_id   = 18;
  optional uint32  group_bucket_lo      = 19;
  optional uint32  group_bucket_hi      = 20;
  // [ADDITIVE] Sequential testing (always-valid mSPRT / GAVI) configuration.
  // `sequential_tau_squared` is optional: absent = auto-derive the mixing
  // variance at compute time.
  bool             sequential_testing_enabled = 21;
  double           sequential_alpha           = 22;
  optional double  sequential_tau_squared     = 23;
  int64            sequential_min_sample_size = 24;
}

// ─── Iteration (a single run of an experiment) ────────────────────────────────

message ExperimentIteration {
  string          id               = 1;
  string          experiment_id    = 2;
  int32           iteration_number = 3;
  int64           started_at_ms    = 4;
  // Zero when the iteration is still running.
  int64           ended_at_ms      = 5;
  // Stringified UUIDs referencing `metric_definitions` rows; Phase 7
  // cutover replaced the previous `metric_keys` (event-key strings).
  repeated string metric_ids       = 6;
  double          traffic_allocation = 7;
  // Snapshot of analysis unit context types at iteration start.
  // Surfaced to the admin Iterations tab so per-iteration context-type
  // badges render correctly without an extra round-trip.
  repeated string unit_context_types = 8;
  // [ADDITIVE] Snapshot of the iteration's exclusion-group assignment, mirroring
  // the parent Experiment fields at iteration start. Absent for experiments
  // not bound to an exclusion group.
  optional string exclusion_group_id = 9;
  optional uint32 group_bucket_lo    = 10;
  optional uint32 group_bucket_hi    = 11;
  // [ADDITIVE] Snapshot of the sequential testing configuration at iteration
  // start (mirrors the parent Experiment fields).
  bool            sequential_testing_enabled = 12;
  double          sequential_alpha           = 13;
  optional double sequential_tau_squared     = 14;
  int64           sequential_min_sample_size = 15;
  // [ADDITIVE] Snapshot of the CUPED pre-period window (days) at iteration
  // start, mirroring the parent Experiment field. 0 = CUPED disabled. The
  // stats-service compute pass reads this to drive numeric-metric variance
  // reduction; absent on rows written before this field existed (decodes to 0).
  uint32          pre_period_days            = 16;
}

// ─── Results ──────────────────────────────────────────────────────────────────

message VariantResult {
  string variant_key       = 1;
  uint64 participant_count = 2;
  map<string, double> metric_values = 3;
  double p_value           = 4;
  bool   p_value_present   = 5;
  // Multiple-comparison-corrected p-value (Bonferroni); empty when single-metric.
  optional double p_value_corrected = 6;
  // Attribution unit context type ("user", "account"). Empty defaults to "user"
  // for back-compat with rows written before the Phase 5 per-context-type cutover.
  string context_type      = 7;
  // Whether this row violates the metric's `goal_direction` (guardrail-only).
  bool   direction_violation = 8;
  // Observed `treatment − control` lift on the metric. `0.0` for the control row.
  double lift              = 9;
  // [ADDITIVE] Sequential testing (always-valid) result for this variant row.
  // All optional — absent when sequential testing was not run. Populated by
  // a later phase; left unset for now.
  optional double sequential_p_value         = 10;
  optional double sequential_ci_lower        = 11;
  optional double sequential_ci_upper        = 12;
  optional bool   sequential_crossed         = 13;
  optional bool   sequential_insufficient_data = 14;
  optional string sequential_method          = 15;
}

// SRM (Sample Ratio Mismatch) summary for one context type's assignment counts.
// Mirrors `stitchd_core::experimentation::stats::srm::SrmResult`.
message SrmPerVariant {
  string variant_key = 1;
  uint64 observed   = 2;
  double expected   = 3;
  double chi_sq_contribution = 4;
}

message SrmResult {
  repeated SrmPerVariant per_variant = 1;
  double overall_chi_sq    = 2;
  double overall_chi_sq_p  = 3;
  // "green" | "yellow" | "red"
  string health           = 4;
}

// One context-type's results bundle (variants + srm + guardrails).
message ContextTypeResults {
  string                 context_type = 1;
  repeated VariantResult variants     = 2;
  // SRM is computed once per context type. Empty when not computed.
  optional SrmResult     srm          = 3;
  // Guardrail per-variant rows (same shape as `variants`).
  repeated VariantResult guardrails   = 4;
}

// Identifies whether the experiment is bound to a specific rule or to the
// flag's default-rule fall-through. Mirrors the `bound_target` JSON.
message BoundTarget {
  // "rule" | "default_rule"
  string kind     = 1;
  // Empty when `kind == "default_rule"`.
  string rule_id  = 2;
  // Human-readable label (rule name, or "Default rule (fallthrough)").
  string label    = 3;
}

message ExperimentResults {
  string                 experiment_id      = 1;
  repeated VariantResult variant_results    = 2;
  int64                  computed_at_ms     = 3;
  bool                   is_stale           = 4;
  int64                  next_run_at_ms     = 5;
  string                 computation_status = 6;
  // Per-context-type result bundle (Phase 7). Keys are context types such as
  // "user" or "account". When empty, callers fall back to `variant_results`.
  repeated ContextTypeResults results_by_context_type = 7;
  // Which target the experiment is bound to (set at create time).
  optional BoundTarget   bound_target       = 8;
  // CUPED pre-period window in days; 0 = disabled.
  uint32                 pre_period_days    = 9;
}

// ─── CRUD requests ────────────────────────────────────────────────────────────

message CreateExperimentRequest {
  Experiment experiment = 1;
}

message UpdateExperimentRequest {
  Experiment experiment = 1;
}

message DeleteExperimentRequest {
  string environment_id = 1;
  string experiment_id  = 2;
}

message GetExperimentRequest {
  string environment_id = 1;
  string experiment_id  = 2;
}

message ListExperimentsRequest {
  string environment_id = 1;
  uint32 page            = 3;
  uint32 per_page        = 4;
}

message ListExperimentsResponse {
  repeated Experiment experiments = 1;
  uint64              total       = 2;
}

message GetResultsRequest {
  string environment_id = 1;
  string experiment_id  = 2;
}

// ─── Lifecycle / transitions ──────────────────────────────────────────────────

message TransitionExperimentRequest {
  string           environment_id = 1;
  string           experiment_id  = 2;
  ExperimentStatus new_status     = 3;
  // Human-readable reason for the transition (optional).
  string           reason         = 4;
}

message ListIterationsRequest {
  string environment_id = 1;
  string experiment_id  = 2;
  // 0-based row offset for paginated listing. Default = 0.
  uint64 offset         = 3;
  // Maximum rows to return. `0` means "no limit" — the service returns the
  // full list (back-compat for stats-service callers that don't paginate).
  uint64 limit          = 4;
}

message ListIterationsResponse {
  repeated ExperimentIteration iterations = 1;
  // Total iterations available for the experiment, regardless of pagination
  // window. Equal to `iterations.len()` when `limit == 0`.
  uint64 total = 2;
}

// ─── Stats-service–facing messages ───────────────────────────────────────────

// A compact view of a running experiment emitted by ListRunningExperiments.
message RunningExperiment {
  string          experiment_id = 1;
  string          environment_id = 2;
  string          iteration_id  = 3;
  repeated string variant_keys  = 4;
  // Stringified UUIDs referencing `metric_definitions` rows.
  repeated string metric_ids    = 5;
  int64           started_at_ms = 6;
  // Always "running" for results returned by this RPC.
  string          status        = 7;
  // [ADDITIVE] Active-iteration snapshot of the compute-pass inputs, carried here
  // so the stats-service scheduler does not need a second `GetExperimentIteration`
  // round-trip per experiment. Mirrors the corresponding `ExperimentIteration`
  // fields; the handler already loads the active iteration to populate
  // `metric_ids`/`variant_keys`, so these are populated from the same row.
  //
  // Analysis unit context types (the compute pass runs one analysis per type).
  // Empty decodes to "user" downstream for back-compat with older servers.
  repeated string unit_context_types         = 8;
  // CUPED pre-period window in days (0 = disabled).
  uint32          pre_period_days            = 9;
  // Sequential-testing configuration snapshot.
  bool            sequential_testing_enabled = 10;
  double          sequential_alpha           = 11;
  optional double sequential_tau_squared     = 12;
  int64           sequential_min_sample_size = 13;
  // [ADDITIVE] Designed per-variant assignment split in basis points
  // (`variant_key` → bp; 1 = 0.01%, 10000 = 100%), sourced from the experiment's
  // bound flag rule (`RuleOutput::Percentage` weights) or the flag's
  // `default_rule_distribution` snapshot. The stats-service SRM check tests
  // observed assignment counts against THIS configured split (expected[v] =
  // total * weight[v] / Σweight) rather than a uniform `1/K` baseline — so a
  // healthy 95/5 canary no longer reads as a massive SRM mismatch. Only the
  // relative split among the experiment's variants is meaningful (a rule may
  // allocate <100% of traffic to the experiment). Empty when the server could
  // not source it (no rule/default-rule weights), in which case the SRM check
  // falls back to the uniform split.
  map<string, uint32> variant_expected_bp        = 14;
}

message ListRunningExperimentsRequest {
  // Reserved for future filtering (e.g. project_id); currently unused.
}

message GetExperimentIterationRequest {
  string iteration_id = 1;
}

message UpdateIterationLastComputedRequest {
  string iteration_id       = 1;
  int64  last_computed_at_ms = 2;
}

message UpdateIterationLastComputedResponse {}

// ─── Exposures (Phase 7) ──────────────────────────────────────────────────────
//
// Paginated read against the ClickHouse `experiment_assignments` table for a
// single experiment + context_type. One row per assigned context.

message ListExposuresRequest {
  string experiment_id = 1;
  // Required — at least one entry of the experiment's `unit_context_types`.
  string context_type  = 2;
  // 0-based offset; defaults to 0.
  uint64 offset        = 3;
  // Page size; capped server-side at 200.
  uint64 limit         = 4;
}

message ExposureRow {
  string context_type   = 1;
  string context_key    = 2;
  string variant_key    = 3;
  // RFC 3339 UTC timestamp of first exposure.
  string assigned_at    = 4;
  // Stringified UUID of the matched rule (empty for default-rule
  // experiments).
  string matched_rule_id = 5;
}

message ListExposuresResponse {
  repeated ExposureRow exposures = 1;
  uint64               total     = 2;
}

// ─── Exclusion groups (mutually-exclusive experiments) ────────────────────────
//
// An exclusion group partitions an environment's traffic into disjoint
// basis-point slices so that member experiments never co-assign the same
// context. `allocated_bp` + `free_bp` always sum to the group's total budget.

message ExclusionGroup {
  string id           = 1;
  string env_id       = 2;
  string name         = 3;
  string description  = 4;
  // Basis points currently allocated to member experiments.
  uint32 allocated_bp = 5;
  // Basis points still available for new assignments.
  uint32 free_bp      = 6;
  // Optimistic-concurrency version, bumped on every mutation.
  int64  version      = 7;
  // The group's diversion (randomization) unit context type, e.g. "user".
  // ALL member experiments must randomize on this unit so a context maps to a
  // single shared exclusion bucket across the group's flags — this is what
  // makes mutual exclusion hold. Immutable after creation.
  string unit_context_type = 8;
}

message CreateExclusionGroupRequest {
  ExclusionGroup group = 1;
}

message GetExclusionGroupRequest {
  string env_id   = 1;
  string group_id = 2;
}

message ListExclusionGroupsRequest {
  string env_id   = 1;
  uint32 page     = 2;
  uint32 per_page = 3;
}

message ListExclusionGroupsResponse {
  repeated ExclusionGroup groups = 1;
  uint64                  total  = 2;
}

message UpdateExclusionGroupRequest {
  ExclusionGroup group = 1;
}

message DeleteExclusionGroupRequest {
  string env_id   = 1;
  string group_id = 2;
}

message DeleteExclusionGroupResponse {}

message AssignExperimentToGroupRequest {
  string env_id        = 1;
  string group_id      = 2;
  string experiment_id = 3;
  // Basis points to carve out of the group's free budget for this experiment.
  uint32 requested_bp  = 4;
}

message AssignExperimentToGroupResponse {
  // Echoes the updated experiment with its assigned bucket range populated.
  Experiment experiment = 1;
  // The group after allocation (reflecting the new allocated/free split).
  ExclusionGroup group  = 2;
}

message UnassignExperimentRequest {
  string env_id        = 1;
  string experiment_id = 2;
}

message UnassignExperimentResponse {
  Experiment     experiment = 1;
  ExclusionGroup group      = 2;
}

// ─── Experiment interactions ──────────────────────────────────────────────────
//
// N-way interaction estimates among a tuple of experiments that share
// assignment population, used to surface possible cross-experiment effects.
// `interaction_order` is the size of the tuple (2 = pairwise, 3 = three-way).

message ExperimentInteraction {
  // Experiment ids participating in this interaction tuple (length ==
  // interaction_order). For a "main" row the tuple is a single experiment.
  repeated string experiment_ids      = 1;
  // Human-readable names aligned 1:1 with `experiment_ids` (same order, same
  // length). Ids without a resolvable experiment fall back to the id string.
  repeated string experiment_names    = 2;
  // Number of experiments in the tuple: 2 for pairwise, 3 for three-way.
  uint32 interaction_order            = 3;
  // Term key: "main:<uuid>" / "2way:<a>x<b>" / "3way:<a>x<b>x<c>".
  string term                         = 4;
  string context_type                 = 5;
  string metric_key                   = 6;
  uint64 shared_count                 = 7;
  double interaction_estimate         = 8;
  double p_value                      = 9;
  // Degrees of freedom of the interaction test.
  uint32 df                           = 10;
  // Significance after family-wise (Benjamini–Hochberg) correction across the
  // batch of interaction tests. False when insufficient_data is true.
  bool   significant                  = 11;
  // True when the cell sample was too small for a valid test. Consumers MUST
  // treat the row as non-actionable and ignore estimate/p_value (persisted as
  // 0.0 sentinels, NOT a real p-value of zero).
  bool   insufficient_data            = 12;
  // Bayesian posterior probability that an interaction effect exists.
  double bayes_prob                   = 13;
  // Bayesian posterior expected interaction effect size.
  double bayes_expected               = 14;
  // Lower bound of the Bayesian credible interval.
  double bayes_ci_low                 = 15;
  // Upper bound of the Bayesian credible interval.
  double bayes_ci_high                = 16;
}

message GetExperimentInteractionsRequest {
  string env_id        = 1;
  string experiment_id = 2;
}

message GetExperimentInteractionsResponse {
  repeated ExperimentInteraction interactions = 1;
}

// ─── Start-time prerequisites read (flag_lifecycle_20260604, Phase 10) ────────
//
// Read an experiment's configured start-time prerequisites — the conditions that
// must hold for a manual or scheduled start to be allowed (enforced in
// `TransitionExperiment` when transitioning into `running`). Two kinds:
//   * flag_variant     — a named flag must currently serve a required variant.
//   * experiment_done  — a referenced experiment must be stopped/concluded.

message StartPrerequisite {
  // "flag_variant" or "experiment_done".
  string kind = 1;
  // flag_variant: the prerequisite flag + required variant (UUIDs).
  string flag_id             = 2;
  string required_variant_id = 3;
  // experiment_done: the prerequisite experiment (UUID).
  string prerequisite_experiment_id = 4;
}

message GetExperimentStartPrerequisitesRequest {
  string environment_id = 1;
  string experiment_id  = 2;
}

message GetExperimentStartPrerequisitesResponse {
  repeated StartPrerequisite prerequisites = 1;
}

// ─── Experimentation service ──────────────────────────────────────────────────

service ExperimentationService {
  rpc CreateExperiment(CreateExperimentRequest) returns (Experiment);
  rpc GetExperiment(GetExperimentRequest)       returns (Experiment);
  rpc ListExperiments(ListExperimentsRequest)   returns (ListExperimentsResponse);
  rpc UpdateExperiment(UpdateExperimentRequest) returns (Experiment);
  rpc DeleteExperiment(DeleteExperimentRequest) returns (Experiment);
  rpc TransitionExperiment(TransitionExperimentRequest) returns (Experiment);
  rpc ListIterations(ListIterationsRequest)     returns (ListIterationsResponse);
  rpc GetResults(GetResultsRequest)             returns (ExperimentResults);

  // ── Stats-service–facing RPCs ──────────────────────────────────────────────
  // Returns a server-side stream of all currently running experiments (across
  // all environments) so that stats-service can poll without touching PG directly.
  rpc ListRunningExperiments(ListRunningExperimentsRequest) returns (stream RunningExperiment);

  // Fetch a single iteration row (variants, metrics, time bounds).
  rpc GetExperimentIteration(GetExperimentIterationRequest) returns (ExperimentIteration);

  // Update the last_computed_at timestamp for a given iteration's stats_schedule row.
  rpc UpdateIterationLastComputed(UpdateIterationLastComputedRequest)
      returns (UpdateIterationLastComputedResponse);

  // ── Phase 7 admin reads ────────────────────────────────────────────────────
  // Paginated read against ClickHouse `experiment_assignments` for one
  // experiment + context_type. Powers the admin UI's "Exposures" panel.
  rpc ListExposures(ListExposuresRequest) returns (ListExposuresResponse);

  // ── Exclusion groups (mutually-exclusive experiments) ──────────────────────
  rpc CreateExclusionGroup(CreateExclusionGroupRequest) returns (ExclusionGroup);
  rpc ListExclusionGroups(ListExclusionGroupsRequest)   returns (ListExclusionGroupsResponse);
  rpc GetExclusionGroup(GetExclusionGroupRequest)       returns (ExclusionGroup);
  rpc UpdateExclusionGroup(UpdateExclusionGroupRequest) returns (ExclusionGroup);
  rpc DeleteExclusionGroup(DeleteExclusionGroupRequest) returns (DeleteExclusionGroupResponse);
  rpc AssignExperimentToGroup(AssignExperimentToGroupRequest) returns (AssignExperimentToGroupResponse);
  rpc UnassignExperiment(UnassignExperimentRequest)     returns (UnassignExperimentResponse);

  // ── Experiment interactions ────────────────────────────────────────────────
  rpc GetExperimentInteractions(GetExperimentInteractionsRequest)
      returns (GetExperimentInteractionsResponse);

  // [ADDITIVE — flag_lifecycle_20260604] Read an experiment's configured
  // start-time prerequisites (flag_variant / experiment_done). Powers the
  // dependency-graph experiment branch + the Admin UI experiment page.
  rpc GetExperimentStartPrerequisites(GetExperimentStartPrerequisitesRequest)
      returns (GetExperimentStartPrerequisitesResponse);
}
