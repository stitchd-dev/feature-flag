syntax = "proto3";

package stitchd.flags.v1;

import "flags/v1/flag_sync.proto";

// ─── Scalar requests ──────────────────────────────────────────────────────────

message GetFlagRequest {
  string environment_id = 1;
  string flag_key       = 2;
  // Project-scoped admin reads set this instead of environment_id.
  string project_id     = 3;
}

message ListFlagsRequest {
  string environment_id  = 1;
  bool   include_archived = 2;
  // Project-scoped admin reads set this instead of environment_id.
  string project_id      = 3;
  // Pagination: 0 means "use server default" (page=1, per_page=50).
  uint32 page     = 4;
  uint32 per_page = 5;
}

message ListFlagsResponse {
  repeated FeatureFlag flags = 1;
  // Total number of flags across all pages (set when page > 0).
  uint64 total = 2;
}

// ─── Mutation ─────────────────────────────────────────────────────────────────

enum MutationKind {
  MUTATION_KIND_UNSPECIFIED = 0;
  MUTATION_KIND_CREATE      = 1;
  MUTATION_KIND_UPDATE      = 2;
  MUTATION_KIND_DELETE      = 3;
  MUTATION_KIND_ARCHIVE     = 4;
}

message MutateFlagRequest {
  string        environment_id = 1;
  MutationKind  kind           = 2;
  FeatureFlag   flag           = 3;
  // Optimistic-locking version — required for UPDATE / DELETE / ARCHIVE.
  // Server rejects with ABORTED if stored version differs.
  uint64        version        = 4;
  // Project-scoped admin operations set this instead of environment_id.
  // When present the service uses project-level repository methods directly.
  string        project_id     = 5;
}

message MutateFlagResponse {
  FeatureFlag flag    = 1;
  uint64      version = 2;
}

// ─── Streaming definitions for SDK sync ───────────────────────────────────────

message GetFlagDefinitionsRequest {
  string environment_id = 1;
}

// ─── Flag hashing config ──────────────────────────────────────────────────────

// Controls which context parameters are used for percentage-rollout hashing.
message FlagHashingConfig {
  string parameter_key  = 1;
  string parameter_type = 2;
  int32  order          = 3;
}

message UpdateFlagHashingRequest {
  string environment_id              = 1;
  string flag_key                    = 2;
  repeated FlagHashingConfig configs = 3;
}

message UpdateFlagHashingResponse {
  FeatureFlag flag                   = 1;
  repeated FlagHashingConfig configs = 2;
}

// ─── Evaluation preview ───────────────────────────────────────────────────────

// Admin-only: simulate flag evaluation against a batch of contexts and return
// a full rule-trace breakdown. Does not record events or affect counters.
message EvaluatePreviewRequest {
  string project_id    = 1;
  string flag_key      = 2;
  // JSON-serialized Vec<Context> (stitchd_core::context::Context).
  string contexts_json = 3;
  // Optional environment_id used for eval-log scoping.
  // Empty string means "unknown" (env_id stored as nil UUID in the log).
  string environment_id = 4;
}

message EvaluatePreviewResponse {
  bool   flag_enabled  = 1;
  // JSON-serialized Vec<ContextPreviewResult> (stitchd_core::evaluation::preview).
  string results_json  = 2;
}

// ─── Flag management service ──────────────────────────────────────────────────

service FlagService {
  // Fetch a single flag definition by key.
  rpc GetFlag(GetFlagRequest) returns (FeatureFlag);

  // List all flag definitions for an environment.
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse);

  // Create, update, delete, or archive a flag.
  rpc MutateFlag(MutateFlagRequest) returns (MutateFlagResponse);

  // Server-streaming endpoint for SDK definition sync.
  rpc GetFlagDefinitions(GetFlagDefinitionsRequest) returns (stream FeatureFlag);

  // Replace the hashing config for a flag (which context params drive rollout %).
  rpc UpdateFlagHashing(UpdateFlagHashingRequest) returns (UpdateFlagHashingResponse);

  // Simulate flag evaluation for admin preview — returns rule traces, no side effects.
  rpc EvaluatePreview(EvaluatePreviewRequest) returns (EvaluatePreviewResponse);
}
