syntax = "proto3";

package stitchd.flags.v1;

import "flags/v1/flag_sync.proto";

// ─── Scalar requests ──────────────────────────────────────────────────────────

message GetFlagRequest {
  string environment_id = 1;
  string flag_key       = 2;
  // Project-scoped admin reads set this instead of environment_id.
  string project_id     = 3;
}

message ListFlagsRequest {
  string environment_id  = 1;
  bool   include_archived = 2;
  // Project-scoped admin reads set this instead of environment_id.
  string project_id      = 3;
  // Cursor (keyset) pagination — the admin (project-scoped) path. An empty
  // cursor is the first page; `limit` defaults to 50, capped at 200.
  string cursor   = 4;
  uint32 limit    = 5;
}

message ListFlagsResponse {
  repeated FeatureFlag flags = 1;
  // Opaque cursor for the next page; empty when there are no more rows.
  string next_cursor = 2;
}

// ─── Mutation ─────────────────────────────────────────────────────────────────

enum MutationKind {
  MUTATION_KIND_UNSPECIFIED       = 0;
  MUTATION_KIND_CREATE            = 1;
  MUTATION_KIND_UPDATE            = 2;
  MUTATION_KIND_DELETE            = 3;
  MUTATION_KIND_ARCHIVE           = 4;
  MUTATION_KIND_RESTORE           = 5;
  // Replace only the variants list, preserving all other flag metadata.
  // Applies the same validation as CREATE/UPDATE (variant values, bool invariant).
  MUTATION_KIND_REPLACE_VARIANTS  = 6;
  // Replace only the rules list (and optionally default_variant_key /
  // default_rule_distribution), preserving all other flag metadata.
  MUTATION_KIND_REPLACE_RULES     = 7;
}

message MutateFlagRequest {
  string        environment_id = 1;
  MutationKind  kind           = 2;
  FeatureFlag   flag           = 3;
  // Optimistic-locking version — required for UPDATE / DELETE / ARCHIVE.
  // Server rejects with ABORTED if stored version differs.
  uint64        version        = 4;
  // Project-scoped admin operations set this instead of environment_id.
  // When present the service uses project-level repository methods directly.
  string        project_id     = 5;
  // When present: override the flag's enabled state to this value.
  // When absent: preserve the current enabled state (no pre-fetch required).
  // Use proto3 optional so callers can distinguish "not provided" from
  // "explicitly set to false".
  optional bool enabled_override = 6;
}

message MutateFlagResponse {
  FeatureFlag flag    = 1;
  uint64      version = 2;
}

// ─── Streaming definitions for SDK sync ───────────────────────────────────────

message GetFlagDefinitionsRequest {
  string environment_id = 1;
}

// ─── Flag hashing config ──────────────────────────────────────────────────────

// Controls which context parameters are used for percentage-rollout hashing.
message FlagHashingConfig {
  string parameter_key  = 1;
  string parameter_type = 2;
  int32  order          = 3;
}

message UpdateFlagHashingRequest {
  string environment_id              = 1;
  string flag_key                    = 2;
  repeated FlagHashingConfig configs = 3;
}

message UpdateFlagHashingResponse {
  FeatureFlag flag                   = 1;
  repeated FlagHashingConfig configs = 2;
}

// ─── Evaluation preview ───────────────────────────────────────────────────────

// Admin-only: simulate flag evaluation against a batch of contexts and return
// a full rule-trace breakdown. Does not record events or affect counters.
message EvaluatePreviewRequest {
  string project_id    = 1;
  string flag_key      = 2;
  // JSON-serialized Vec<Context> (stitchd_core::context::Context).
  string contexts_json = 3;
  // Optional environment_id used for eval-log scoping.
  // Empty string means "unknown" (env_id stored as nil UUID in the log).
  string environment_id = 4;
}

message EvaluatePreviewResponse {
  bool   flag_enabled  = 1;
  // JSON-serialized Vec<ContextPreviewResult> (stitchd_core::evaluation::preview).
  string results_json  = 2;
}

// ─── Default-rule distribution (Phase 7 Task 5) ───────────────────────────────
//
// Sets or clears the flag's percentage distribution used by the default-rule
// fall-through. Rejected with FAILED_PRECONDITION + the
// `flag_locked_by_experiment:<uuid>` sentinel when the flag is currently
// locked by a running/paused experiment.

message DefaultRuleAllocation {
  string variant_key = 1;
  // In (0, 100]. Sum across all entries must equal 100 ± 0.01.
  double percentage  = 2;
}

message SetDefaultRuleDistributionRequest {
  // Project-scoped admin operation — required.
  string project_id = 1;
  // Flag identifier — the flag key within the project.
  string flag_key   = 2;
  // The new distribution. Empty `allocations` clears the distribution
  // (reverting the flag to single-default-variant behaviour).
  repeated DefaultRuleAllocation allocations = 3;
  // Optimistic-locking version (matches FeatureFlag.version).
  uint64 version    = 4;
}

message SetDefaultRuleDistributionResponse {
  FeatureFlag flag    = 1;
  uint64      version = 2;
}

// ─── Prerequisites (flag_lifecycle_20260604) ──────────────────────────────────
//
// Manage a flag's prerequisite gate: the set of (prerequisite_flag,
// required_variant) deps plus the per-flag fallback variant returned when the
// gate fails. Write-time cycle detection rejects edges that would form a cycle
// in the prerequisite DAG (added in Phase 4).

message SetPrerequisitesRequest {
  // Project-scoped admin operation — required.
  string project_id = 1;
  // Flag whose prerequisites are being set (key within the project).
  string flag_key    = 2;
  // The full replacement set of prerequisites. Empty clears all prerequisites.
  repeated FlagPrerequisite prerequisites = 3;
  // Key of the fallback variant returned when the gate fails. Empty string
  // means "fall back to the flag's off/disabled variant".
  string fallback_variant_key = 4;
  // Optimistic-locking version (matches FeatureFlag.version).
  uint64 version     = 5;
}

message SetPrerequisitesResponse {
  FeatureFlag flag    = 1;
  uint64      version = 2;
}

message GetPrerequisitesRequest {
  // Project-scoped admin read — required.
  string project_id = 1;
  // Flag whose prerequisites are being fetched (key within the project).
  string flag_key   = 2;
}

message GetPrerequisitesResponse {
  repeated FlagPrerequisite prerequisites = 1;
  // Key of the configured fallback variant, or empty for the off/disabled variant.
  string fallback_variant_key = 2;
}

// ─── Privileged bandit allocation-update (bandit_20260608 Phase 3) ─────────────
//
// A bandit experiment must rewrite its bound flag-rule's percentage allocation
// on every stats tick. The whole-flag experiment lock makes ALL human
// flag/rule mutations return FAILED_PRECONDITION (`flag_locked_by_experiment`)
// while an experiment is running/paused. This RPC is the ONE sanctioned,
// system-actor writer that BYPASSES that lock — but ONLY for the experiment
// that currently owns the lock. A caller whose `experiment_id` does not match
// the flag's current lock owner is rejected (FAILED_PRECONDITION) so an
// arbitrary caller cannot use this path to dodge the human lock.
//
// The write is version-bumped (optimistic concurrency) and audit-logged
// attributed to the bandit/system actor (mirrors how the scheduler attributes
// system mutations: actor_id = None).

message BanditUpdateAllocationRequest {
  // Project-scoped operation — required.
  string project_id     = 1;
  // Flag identifier — the flag key within the project.
  string flag_key       = 2;
  // Environment the experiment runs in (audit/scoping metadata).
  string environment_id = 3;
  // The bandit experiment requesting the reallocation. MUST match the flag's
  // current lock owner, else the request is rejected.
  string experiment_id  = 4;
  // Optimistic-locking version (matches FeatureFlag.version). Server rejects
  // with ABORTED when the stored version differs.
  uint64 version        = 5;
  // The new allocation in basis points (sum 10000). Reuses AllocationBucket
  // (variant_key + weight_bp) from flag_sync.proto.
  repeated AllocationBucket allocations = 6;
  // Target selector — exactly one of the following identifies the bound rule
  // whose allocation is rewritten:
  oneof target {
    // Rewrite the percentage weights of this custom rule (its RuleId UUID).
    string flag_rule_id = 7;
    // Rewrite the flag's default-rule distribution.
    bool   default_rule = 8;
  }
  // [ADDITIVE — bandit_20260608] Optional snapshot-resident real-time bandit
  // model. When present, the targeted custom rule's `realtime_bandit` model is
  // refreshed (so the next snapshot build + SDK poll delivers the new posteriors
  // and eval samples per-context) instead of rewriting the static weights. Only
  // valid with `flag_rule_id` (a default-rule distribution has no rule output to
  // carry a model). The `allocations` still ride along as the fallback static
  // split for contexts without the diversion unit.
  optional RealtimeBanditModel realtime_model = 9;
}

message BanditUpdateAllocationResponse {
  FeatureFlag flag    = 1;
  // The post-write optimistic-concurrency version.
  uint64      version = 2;
}

// ─── Flag management service ──────────────────────────────────────────────────

service FlagService {
  // Fetch a single flag definition by key.
  rpc GetFlag(GetFlagRequest) returns (FeatureFlag);

  // List all flag definitions for an environment.
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse);

  // Create, update, delete, or archive a flag.
  rpc MutateFlag(MutateFlagRequest) returns (MutateFlagResponse);

  // Server-streaming endpoint for SDK definition sync.
  rpc GetFlagDefinitions(GetFlagDefinitionsRequest) returns (stream FeatureFlag);

  // Replace the hashing config for a flag (which context params drive rollout %).
  rpc UpdateFlagHashing(UpdateFlagHashingRequest) returns (UpdateFlagHashingResponse);

  // Simulate flag evaluation for admin preview — returns rule traces, no side effects.
  rpc EvaluatePreview(EvaluatePreviewRequest) returns (EvaluatePreviewResponse);

  // Set or clear the flag's default-rule percentage distribution.
  // Rejects with FAILED_PRECONDITION when the flag is locked.
  rpc SetDefaultRuleDistribution(SetDefaultRuleDistributionRequest)
      returns (SetDefaultRuleDistributionResponse);

  // [ADDITIVE — flag_lifecycle_20260604] Replace a flag's prerequisite gate
  // (deps + fallback variant). Rejects with INVALID_ARGUMENT when the edge set
  // would form a cycle in the prerequisite DAG.
  rpc SetPrerequisites(SetPrerequisitesRequest) returns (SetPrerequisitesResponse);

  // [ADDITIVE — flag_lifecycle_20260604] Read a flag's prerequisite gate.
  rpc GetPrerequisites(GetPrerequisitesRequest) returns (GetPrerequisitesResponse);

  // [ADDITIVE — bandit_20260608] Privileged, system-actor allocation update for
  // a running bandit experiment. Rewrites the bound rule's percentage weights
  // (or the default-rule distribution), BYPASSING the whole-flag human lock —
  // but only for the experiment that currently owns the lock. Rejects with
  // FAILED_PRECONDITION when the supplied experiment_id is not the lock owner,
  // and with ABORTED on a version mismatch.
  rpc BanditUpdateAllocation(BanditUpdateAllocationRequest)
      returns (BanditUpdateAllocationResponse);
}
