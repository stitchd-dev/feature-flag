syntax = "proto3";

package stitchd.flags.v1;

import "common/v1/context.proto";
import "segments/v1/segment.proto";

// --- Variant value types ---

message VariantValue {
  oneof value {
    bool   bool_value   = 1;
    int64  int_value    = 2;
    double double_value = 3;
    string string_value = 4;
    string json_value   = 5; // JSON serialised as string
  }
}

message Variant {
  string       key   = 1;
  VariantValue value = 2;
  // [ADDITIVE — flag_lifecycle_20260604] UUID of the variant. Admin metadata,
  // surfaced on the GetFlag/ListFlags read path so cross-service consumers (e.g.
  // the experimentation-service `flag_variant` start-prerequisite) can compare
  // the served variant by its stable UUID rather than by key. Empty on the SDK
  // definition-sync path, which is key-only.
  string       id    = 3;
}

// --- Percentage allocation ---

// A single bucket in a percentage rollout.
message AllocationBucket {
  // Variant key this bucket maps to.
  string variant_key  = 1;
  // Weight in basis points (e.g. 10000 = 100.0%, 5000 = 50.0%).
  uint32 weight_bp = 2;
}

// Percentage allocation: deterministic hash over context keys/params.
// hash(targeted_keys, flag_key, project_id, environment_id) mod 100_000
message PercentageAllocation {
  repeated AllocationBucket buckets = 1;
  // Ordered selector list (the canonical percentage-hash input).
  // Selector order is significant for hash stability. Each selector resolves
  // either to a context's `key` (HashSelector.context_key) or to a named
  // parameter on a context (HashSelector.context_parameter). Empty list is
  // invalid at the API boundary; the server-side validator rejects it. See
  // `stitchd-core::evaluation::types::HashInputSpec` for the canonical
  // domain representation.
  repeated HashSelector hash_inputs = 2;
  // Optional exclusion gate. When present, the experiment/flag rule
  // only applies to contexts whose group-salt hash bucket falls within
  // [bucket_lo, bucket_hi). Used by mutually-exclusive experiment groups so
  // that overlapping experiments carve out disjoint slices of traffic.
  optional ExclusionGate exclusion_gate = 3;
  // Optional real-time bandit model (bandit_20260608). When present,
  // the rule's variant is drawn per-context from the snapshot-resident reward
  // posteriors (a Thompson draw seeded by the unit context's key) INSTEAD of the
  // static bucket→weight allocation. Mirrors `exclusion_gate`: pure rule data
  // that rides the snapshot, sampled with zero DB lookup at eval time. Absent on
  // every non-realtime-bandit rule, which keeps the static eval path unchanged.
  optional RealtimeBanditModel realtime_bandit = 4;
}

// [ADDITIVE — bandit_20260608] Snapshot-resident reward model for a real-time
// (snapshot-resident) bandit rule. Rides on the flag definition snapshot exactly
// like ExclusionGate; the evaluator draws one Thompson sample per variant from
// these posteriors (context-seeded RNG) and assigns the argmax variant. Pure +
// zero-DB + deterministic. The stats tick refreshes these params each tick.
message RealtimeBanditModel {
  // Salt mixed into the per-context sampling seed so the same unit produces a
  // stable draw for this experiment and a different one for another.
  string salt = 1;
  // The context type whose `key` seeds the per-context draw (the experiment's
  // randomization / diversion unit, e.g. "user"). If no context of this type is
  // present in the evaluated bundle, the rule falls back to the static
  // allocation gracefully (a missing unit cannot be sampled).
  string unit_context_type = 2;
  // Reward-metric family driving the posteriors — selects Beta (conversion /
  // funnel) vs Normal (numeric / ratio) sampling.
  RewardFamily family = 3;
  // Goal direction: whether a higher (INCREASE) or lower (DECREASE) reward is
  // better. The evaluator picks the goal-directed argmax of the sampled draws.
  BanditGoalDirection goal = 4;
  // Per-variant posterior parameters. One entry per variant the rule can
  // assign. Used by the NON-contextual realtime path; ignored when `contextual`
  // is set.
  repeated VariantPosterior variants = 5;
  // [ADDITIVE — bandit_20260608 Phase 6] Optional contextual reward model. When
  // set, the variant is drawn per-context from the linear model (a
  // feature-conditioned Thompson draw) instead of the non-contextual `variants`
  // posteriors. A model is EITHER non-contextual (`variants`) OR contextual
  // (`contextual`). Absent on every non-contextual realtime rule.
  optional ContextualModel contextual = 6;
}

// [ADDITIVE — bandit_20260608 Phase 6] A snapshot-resident contextual reward
// model: a shared feature set plus one linear coefficient vector per variant.
message ContextualModel {
  // The features every variant's coefficients are defined over, in order. The
  // design vector is [1.0 (intercept), <feat0 slots>, <feat1 slots>, ...].
  repeated FeatureSpec features = 1;
  // Per-variant coefficient vectors.
  repeated VariantCoefficients variants = 2;
}

// One context feature the reward model conditions on.
message FeatureSpec {
  // The context type whose parameter is read (e.g. "user").
  string context_type = 1;
  // The parameter name within that context (e.g. "plan").
  string parameter = 2;
  // How the parameter value is encoded into the design vector.
  FeatureEncoding encoding = 3;
}

// How a single context feature is turned into design-vector slot(s).
message FeatureEncoding {
  oneof kind {
    // Numeric passthrough — one slot (missing / unparsable → 0.0).
    NumericEncoding numeric = 1;
    // One-hot — one slot per category (unknown / missing → all 0.0 baseline).
    OneHotEncoding one_hot = 2;
  }
}

// Numeric passthrough encoding (no parameters).
message NumericEncoding {}

// One-hot categorical encoding.
message OneHotEncoding {
  // Categories to encode, in declaration order — one slot each.
  repeated string categories = 1;
}

// The fitted linear reward coefficients for one variant.
message VariantCoefficients {
  // The variant key these coefficients predict reward for.
  string variant_key = 1;
  // Intercept-first coefficient vector (len == 1 + sum of feature widths).
  repeated double coeffs = 2;
  // Optional flattened d*d row-major (X^T X + lambda I)^-1 for the LinUCB
  // exploration term (d == coeffs length). Empty → fixed exploration variance.
  repeated double a_inv = 3;
}

// Reward-metric family for a real-time bandit posterior.
enum RewardFamily {
  REWARD_FAMILY_UNSPECIFIED = 0;
  // Conversion / funnel rate — Beta(alpha, beta) posterior.
  REWARD_FAMILY_BETA   = 1;
  // Continuous numeric / ratio mean — Normal(mu, sigma2) posterior.
  REWARD_FAMILY_NORMAL = 2;
}

// Goal direction for a real-time bandit reward.
enum BanditGoalDirection {
  BANDIT_GOAL_DIRECTION_UNSPECIFIED = 0;
  // Higher reward is better (argmax of draws).
  BANDIT_GOAL_DIRECTION_INCREASE = 1;
  // Lower reward is better (argmin of draws).
  BANDIT_GOAL_DIRECTION_DECREASE = 2;
}

// Posterior parameters for one variant of a real-time bandit.
//
// For a Beta family `alpha`/`beta` carry the posterior; `mu`/`sigma2` are
// ignored. For a Normal family `mu` (posterior mean) and `sigma2` (posterior
// variance) carry the posterior; `alpha`/`beta` are ignored. General enough that
// Phase 6 (contextual) can extend with per-feature coefficients.
message VariantPosterior {
  string variant_key = 1;
  double alpha  = 2;
  double beta   = 3;
  double mu     = 4;
  double sigma2 = 5;
}

// [ADDITIVE] Bucket-range gate over a per-group salt hash. Buckets are in the
// same 0..100_000 (basis-point ×10) space as PercentageAllocation hashing.
message ExclusionGate {
  // Salt identifying the exclusion group; mixed into the hash input so each
  // group partitions traffic independently.
  string group_salt = 1;
  // Inclusive lower bound of the assigned bucket range.
  uint32 bucket_lo  = 2;
  // Exclusive upper bound of the assigned bucket range.
  uint32 bucket_hi  = 3;
  // The context type whose `key` is hashed to derive the exclusion-group
  // bucket (the experiment's randomization unit, e.g. "user"). If no context
  // of this type is present in the evaluated bundle, the context is held out
  // (not enrolled) — a missing randomization unit cannot be bucketed.
  string context_type = 4;
}

// One contributor to the percentage-allocation hash input. Mirrors the
// `stitchd-core::evaluation::types::HashSelector` enum; serde and prost
// representations stay aligned so the gateway DTO conversions are trivial.
message HashSelector {
  oneof selector {
    // Hash the `key` of the named context type.
    ContextKeySelector context_key = 1;
    // Hash a specific parameter of the named context type.
    ContextParameterSelector context_parameter = 2;
  }
}

message ContextKeySelector {
  string context_type = 1;
}

message ContextParameterSelector {
  string context_type = 1;
  string parameter    = 2;
}

// --- Rules (skeleton; full rule types added in core track) ---

message FlagRule {
  // Opaque serialised rule payload — parsed by the client rule engine.
  // Full typed rule messages will replace this in the rules track.
  bytes rule_payload = 1;
  // Output when this rule matches.
  oneof output {
    string               variant_key = 2;
    PercentageAllocation allocation  = 3;
  }
  // Optional human-readable label. Ignored by the evaluator; UI metadata only.
  string name = 4;
  // UUID of the underlying `feature_flag_rules.id` row. Admin-only metadata —
  // empty in SDK sync responses. Used by the admin UI (e.g. experiment
  // creation) to bind to a specific rule without faking placeholder UUIDs.
  string rule_id = 5;
}

// --- Prerequisites ---

// [ADDITIVE — flag_lifecycle_20260604] A single flag→flag prerequisite gate.
// The dependent flag only proceeds to its own rules when the prerequisite flag
// resolves to the required variant; otherwise the dependent flag returns its
// configured fallback variant (see FeatureFlag.fallback_variant_key).
//
// Both the UUID and the key are carried so this message rides BOTH the SDK
// definition-sync snapshot (keys, for local resolution) and the admin/preview
// snapshot (UUIDs, admin metadata). SDK-sync responses leave the *_id fields
// empty; admin RPC responses populate both.
message FlagPrerequisite {
  // UUID of the prerequisite flag. Admin metadata — empty in SDK sync.
  string prerequisite_flag_id  = 1;
  // Key of the prerequisite flag — used by the SDK for local resolution.
  string prerequisite_flag_key = 2;
  // UUID of the required variant. Admin metadata — empty in SDK sync.
  string required_variant_id   = 3;
  // Key of the variant the prerequisite flag must resolve to for the gate to pass.
  string required_variant_key  = 4;
}

// --- Feature flag ---

enum FlagValueType {
  FLAG_VALUE_TYPE_UNSPECIFIED = 0;
  FLAG_VALUE_TYPE_BOOL        = 1;
  FLAG_VALUE_TYPE_INT         = 2;
  FLAG_VALUE_TYPE_DOUBLE      = 3;
  FLAG_VALUE_TYPE_STRING      = 4;
  FLAG_VALUE_TYPE_JSON        = 5;
}

message FeatureFlag {
  string         key                = 1;
  bool           enabled            = 2;
  FlagValueType  value_type         = 3;
  repeated Variant variants         = 4;
  // Evaluated in order; first match wins. Last rule is the default fallback.
  repeated FlagRule rules           = 5;
  string         name               = 6;
  string         description        = 7;
  // Admin metadata — populated by FlagService admin RPCs, empty in SDK sync.
  string         flag_id            = 8;  // UUID of the flag record
  uint64         version            = 9;  // optimistic-concurrency version
  string         default_variant_key = 10; // key of the default variant, if set
  int64          created_at_ms      = 11; // epoch milliseconds
  int64          updated_at_ms      = 12; // epoch milliseconds
  bool           archived           = 13; // true when soft-deleted
  // UUID of the experiment currently locking this flag (running or paused),
  // or the empty string when the flag is not locked. Admin-only — empty in
  // SDK sync responses. Lets the admin UI surface the lock badge before the
  // user attempts a save and gets a 409.
  string         locked_by_experiment_id = 14;
  // [ADDITIVE — flag_lifecycle_20260604] Prerequisite gate. Evaluated before
  // this flag's own rules: if any prerequisite flag does not resolve to its
  // required variant, this flag returns `fallback_variant_key` and skips its
  // rules. Populated in BOTH the SDK definition-sync snapshot and the
  // evaluate-preview snapshot so SDK + preview gate identically.
  repeated FlagPrerequisite prerequisites = 15;
  // Key of the variant returned when a prerequisite gate fails. Empty string
  // means "fall back to the flag's off/disabled variant".
  string         fallback_variant_key = 16;
}

// --- SDK sync service ---

message SyncRequest {
  // Contexts the client was initialised with.
  repeated stitchd.common.v1.Context contexts = 1;
}

message SyncResponse {
  repeated FeatureFlag flags = 1;
  // Epoch millis — client uses this to detect stale payloads.
  int64 server_timestamp_ms  = 2;
  // Rule-based segment definitions for local evaluation.
  repeated stitchd.segments.v1.RuleSegment rule_segments = 3;
  // List-based segment metadata (key + context_type only, no list entries).
  // The SDK uses these to identify which segments require a list-check API call.
  repeated stitchd.segments.v1.ListSegmentMeta list_segments = 4;
  // UUID of the resolved environment — SDK uses this in REST list-check URLs.
  string environment_id = 5;
}

service FlagSyncService {
  // Returns all feature flags and associated data for the calling environment.
  // SDK key is supplied via gRPC metadata header `x-sdk-key`.
  rpc Sync(SyncRequest) returns (SyncResponse);
}
