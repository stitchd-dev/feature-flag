syntax = "proto3";

package stitchd.management.v1;

// ─── Org ──────────────────────────────────────────────────────────────────────

message CreateOrgRequest {
  string name = 1;
}

message CreateOrgResponse {
  string org_id        = 1;
  string org_name      = 2;
  // The default project auto-created with the org.
  string project_id    = 3;
  string project_name  = 4;
  string created_at    = 5;
}

// ─── Project ──────────────────────────────────────────────────────────────────

message CreateProjectRequest {
  string org_id = 1;
  string name   = 2;
}

message CreateProjectResponse {
  string project_id   = 1;
  string project_name = 2;
}

message ListProjectsRequest {
  string org_id = 1;
}

message ProjectSummary {
  string project_id   = 1;
  string project_name = 2;
  string created_at   = 3;
}

message ListProjectsResponse {
  repeated ProjectSummary projects = 1;
}

message RenameProjectRequest {
  string project_id = 1;
  string name       = 2;
}

message RenameProjectResponse {}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {}

// ─── Environment ─────────────────────────────────────────────────────────────

message CreateEnvironmentRequest {
  string project_id = 1;
  string name       = 2;
}

message CreateEnvironmentResponse {
  string environment_id   = 1;
  string environment_name = 2;
}

message ListEnvironmentsRequest {
  string project_id = 1;
}

message EnvironmentSummary {
  string environment_id   = 1;
  string environment_name = 2;
  string created_at       = 3;
}

message ListEnvironmentsResponse {
  repeated EnvironmentSummary environments = 1;
}

message RenameEnvironmentRequest {
  string environment_id = 1;
  string name           = 2;
}

message RenameEnvironmentResponse {}

message DeleteEnvironmentRequest {
  string environment_id = 1;
}

message DeleteEnvironmentResponse {}

// ─── SDK Key ──────────────────────────────────────────────────────────────────

message CreateSdkKeyRequest {
  string environment_id = 1;
  string name           = 2;
}

message CreateSdkKeyResponse {
  string sdk_key_id  = 1;
  // The raw key — only returned on creation, never stored in plaintext.
  string raw_key     = 2;
  string name        = 3;
}

message ListSdkKeysRequest {
  string environment_id = 1;
  // Cursor (keyset) pagination. An empty cursor is the first page; `limit`
  // defaults to 50, capped at 200.
  string cursor         = 2;
  uint32 limit          = 3;
}

message SdkKeySummary {
  string sdk_key_id    = 1;
  bool   is_active     = 2;
  string created_at    = 3;
  string revoked_at    = 4;
  string name          = 5;
}

message ListSdkKeysResponse {
  repeated SdkKeySummary sdk_keys = 1;
  // Opaque cursor for the next page; empty when there are no more rows.
  string next_cursor = 2;
}

message RevokeSdkKeyRequest {
  string sdk_key_id = 1;
}

message RevokeSdkKeyResponse {}

// ─── Org list/get (superadmin) ────────────────────────────────────────────────

message ListOrgsRequest {}

message OrgSummary {
  string org_id     = 1;
  string org_name   = 2;
  string created_at = 3;
}

message ListOrgsResponse {
  repeated OrgSummary orgs = 1;
}

message GetOrgRequest {
  string org_id = 1;
}

message GetOrgResponse {
  string org_id     = 1;
  string org_name   = 2;
  string created_at = 3;
}

// ─── User ─────────────────────────────────────────────────────────────────────

message CreateUserRequest {
  string org_id       = 1;
  string email        = 2;
  string display_name = 3;
  string password     = 4;
  // "org_admin" or "org_member"
  string org_role     = 5;
}

message CreateUserResponse {
  string user_id      = 1;
  string email        = 2;
  string display_name = 3;
}

message ListOrgUsersRequest {
  string org_id   = 1;
  uint32 page     = 2;
  uint32 per_page = 3;
}

message RemoveOrgUserRequest {
  string org_id  = 1;
  string user_id = 2;
}

message RemoveOrgUserResponse {}

message OrgUserSummary {
  string user_id      = 1;
  string email        = 2;
  string display_name = 3;
  string role         = 4;
  string created_at   = 5;
}

message ListOrgUsersResponse {
  repeated OrgUserSummary users = 1;
  uint64                  total = 2;
}

// ─── Management service ───────────────────────────────────────────────────────

service ManagementService {
  // Org
  rpc CreateOrg(CreateOrgRequest)               returns (CreateOrgResponse);
  rpc ListOrgs(ListOrgsRequest)                 returns (ListOrgsResponse);
  rpc GetOrg(GetOrgRequest)                     returns (GetOrgResponse);

  // Project
  rpc CreateProject(CreateProjectRequest)       returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest)         returns (ListProjectsResponse);
  rpc RenameProject(RenameProjectRequest)       returns (RenameProjectResponse);
  rpc DeleteProject(DeleteProjectRequest)       returns (DeleteProjectResponse);

  // Environment
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
  rpc ListEnvironments(ListEnvironmentsRequest)   returns (ListEnvironmentsResponse);
  rpc RenameEnvironment(RenameEnvironmentRequest) returns (RenameEnvironmentResponse);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse);

  // SDK Key
  rpc CreateSdkKey(CreateSdkKeyRequest)         returns (CreateSdkKeyResponse);
  rpc ListSdkKeys(ListSdkKeysRequest)           returns (ListSdkKeysResponse);
  rpc RevokeSdkKey(RevokeSdkKeyRequest)         returns (RevokeSdkKeyResponse);

  // User
  rpc CreateUser(CreateUserRequest)             returns (CreateUserResponse);
  rpc ListOrgUsers(ListOrgUsersRequest)         returns (ListOrgUsersResponse);
  rpc RemoveOrgUser(RemoveOrgUserRequest)       returns (RemoveOrgUserResponse);
}
