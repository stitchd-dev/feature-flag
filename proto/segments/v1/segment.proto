syntax = "proto3";

package stitchd.segments.v1;

// --- List-based segment ---

// Targets a specific context type by explicit include/exclude key lists.
message ListSegment {
  string          key          = 1;
  string          context_type = 2;
  repeated string included_keys = 3;
  repeated string excluded_keys = 4;
}

// --- Rule-based segment ---

// A rule-based segment with its full rule payload for client-side evaluation.
// (Full typed rule messages added in the rules track.)
message RuleSegment {
  string key          = 1;
  string context_type = 2;
  // Opaque serialised rule payload — parsed by the client rule engine.
  bytes  rule_payload = 3;
  // UUID of the segment — used by the SDK to correlate ConditionExpr references.
  string id           = 4;
}

// --- List segment metadata (sync payload) ---

// Lightweight metadata for a list-based segment.
// The SDK receives this during definition sync so it knows which segments
// require a server lookup for membership resolution. The list entries
// themselves are NOT included here — they are fetched on demand via the
// list-check REST API.
message ListSegmentMeta {
  // Segment key, used in flag rules and as the segment_key in list-check requests.
  string key          = 1;
  // The context type this segment applies to (e.g. "user", "org").
  string context_type = 2;
  // UUID of the segment — used by the SDK to correlate ConditionExpr references.
  string id           = 3;
}

// --- Sync payload ---

// Segment data returned as part of the flag sync response (embedded via FlagSyncService).
message SegmentBundle {
  repeated ListSegment list_segments = 1;
  repeated RuleSegment rule_segments = 2;
}
