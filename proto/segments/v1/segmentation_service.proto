syntax = "proto3";

package stitchd.segments.v1;

import "segments/v1/segment.proto";

// ─── Scalar requests ──────────────────────────────────────────────────────────

message GetSegmentRequest {
  string environment_id = 1;
  string segment_key    = 2;
}

message ListSegmentsRequest {
  string environment_id = 1;
}

message ListSegmentsResponse {
  repeated RuleSegment     rule_segments = 1;
  repeated ListSegmentMeta list_segments = 2;
}

// ─── Membership evaluation ────────────────────────────────────────────────────

message EvaluateMembershipRequest {
  string environment_id = 1;
  string segment_key    = 2;
  // The context key to test for membership.
  string context_key    = 3;
  string context_type   = 4;
}

message EvaluateMembershipResponse {
  bool is_member = 1;
}

// ─── Mutation ─────────────────────────────────────────────────────────────────

enum SegmentMutationKind {
  SEGMENT_MUTATION_KIND_UNSPECIFIED = 0;
  SEGMENT_MUTATION_KIND_CREATE      = 1;
  SEGMENT_MUTATION_KIND_UPDATE      = 2;
  SEGMENT_MUTATION_KIND_DELETE      = 3;
}

message MutateSegmentRequest {
  string              environment_id = 1;
  SegmentMutationKind kind           = 2;
  // Exactly one of rule_segment or list_segment must be set.
  oneof segment {
    RuleSegment rule_segment = 3;
    ListSegment list_segment = 4;
  }
  uint64 version = 5;
}

message MutateSegmentResponse {
  oneof segment {
    RuleSegment rule_segment = 1;
    ListSegment list_segment = 2;
  }
  uint64 version = 3;
}

// ─── Admin segment message ────────────────────────────────────────────────────

// Full admin representation of a segment (used by the management UI).
message AdminSegment {
  string          id             = 1;
  string          environment_id = 2;
  string          name           = 3;
  string          description    = 4;
  repeated string tags           = 5;
  // JSON-encoded ConditionExpr, empty string when not set.
  bytes           condition_expr = 6;
  int64           created_at_ms  = 7;
  int64           updated_at_ms  = 8;
  uint64          version        = 9;
  // "list" or "rule"
  string          segment_type   = 10;
  // Context kind this list targets (e.g. "user", "org", "device").
  // Only meaningful for list-based segments.
  string          context_type   = 11;
  // Count of include-list entries (list-based segments only).
  uint32          include_count  = 12;
  // Count of exclude-list entries (list-based segments only).
  uint32          exclude_count  = 13;
}

// ─── AddEntries / RemoveEntries messages ─────────────────────────────────────

message AddEntriesRequest {
  string          segment_id   = 1;
  string          context_type = 2;
  // "include" or "exclude"
  string          list_type    = 3;
  repeated string keys         = 4;
}

message AddEntriesResponse {
  int64 added_count = 1;
}

message RemoveEntriesRequest {
  string          segment_id   = 1;
  string          context_type = 2;
  // "include" or "exclude"
  string          list_type    = 3;
  repeated string keys         = 4;
}

message RemoveEntriesResponse {
  int64 removed_count = 1;
}

// ─── List-generation activation (flag_lifecycle_20260604, Phase 10) ──────────
//
// Activate a prepared list-segment generation: atomically swap the entire
// include/exclude member set in via the ScyllaDB generation-swap (writes a fresh
// generation then CAS-flips the active-generation pointer), so a scheduled
// `list_generation` change can fire a full-replace as one atomic activation. The
// `include`/`exclude` keys are the prepared generation's full member set.

message ActivateListGenerationRequest {
  string          segment_id   = 1;
  // Context kind this list targets (e.g. "user"); defaults to "user" when empty.
  string          context_type = 2;
  // Full include-list of the prepared generation.
  repeated string include      = 3;
  // Full exclude-list of the prepared generation.
  repeated string exclude      = 4;
}

message ActivateListGenerationResponse {
  // Number of include/exclude entries activated.
  int64 include_count = 1;
  int64 exclude_count = 2;
}

// ─── Entry patch / lookup messages ───────────────────────────────────────────

// Patch (add/remove/replace) entries in a list segment.
message PatchSegmentEntriesRequest {
  string          segment_id = 1;
  repeated string keys       = 2;
  // "include" or "exclude"
  string          list_type  = 3;
  // "add"     — union CSV keys into the existing list
  // "remove"  — remove matching keys from the list
  // "replace" — replace the entire list with these keys
  string          action     = 4;
  string          org_id     = 5;
}

message PatchSegmentEntriesResponse {
  uint32 include_count = 1;
  uint32 exclude_count = 2;
}

message LookupSegmentEntryRequest {
  string segment_id = 1;
  string key        = 2;
  string org_id     = 3;
}

message LookupSegmentEntryResponse {
  bool in_include = 1;
  bool in_exclude = 2;
}

// ─── Admin CRUD requests ──────────────────────────────────────────────────────

message ListAdminSegmentsRequest {
  string environment_id = 1;
  // Cursor (keyset) pagination. An empty cursor is the first page; `limit`
  // defaults to 50, capped at 200.
  string cursor         = 2;
  uint32 limit          = 3;
}

message ListAdminSegmentsResponse {
  repeated AdminSegment segments = 1;
  // Opaque cursor for the next page; empty when there are no more rows.
  string next_cursor = 2;
}

message GetAdminSegmentRequest {
  string segment_id = 1;
  // The caller's org — used to scope the lookup.
  string org_id     = 2;
}

message CreateAdminSegmentRequest {
  string          environment_id = 1;
  string          name           = 2;
  string          description    = 3;
  repeated string tags           = 4;
  bytes           condition_expr = 5;
  repeated string user_list      = 6;
  // "list" or "rule"
  string          segment_type   = 7;
  // Context kind this list targets (e.g. "user", "org", "device").
  // Defaults to "user" when omitted for backward compatibility.
  string          context_type   = 8;
  // Keys explicitly excluded from this segment (list-based only).
  repeated string excluded_keys  = 9;
}

message UpdateAdminSegmentRequest {
  string          segment_id     = 1;
  string          name           = 2;
  string          description    = 3;
  repeated string tags           = 4;
  bytes           condition_expr = 5;
  repeated string user_list      = 6;
  uint64          version        = 7;
  // Context kind this list targets (e.g. "user", "org", "device").
  // Defaults to "user" when omitted for backward compatibility.
  string          context_type   = 8;
  // Keys to explicitly exclude from this segment (list-based only).
  repeated string excluded_keys  = 9;
}

message DeleteAdminSegmentRequest {
  string segment_id = 1;
  string org_id     = 2;
}

message DeleteAdminSegmentResponse {}

// ─── Segmentation service ─────────────────────────────────────────────────────

service SegmentationService {
  // Fetch a single segment definition by key.
  rpc GetSegment(GetSegmentRequest) returns (SegmentBundle);

  // List all segments for an environment.
  rpc ListSegments(ListSegmentsRequest) returns (ListSegmentsResponse);

  // Evaluate whether a context key is a member of a segment.
  // Handles both rule-based and list-based segments.
  rpc EvaluateMembership(EvaluateMembershipRequest) returns (EvaluateMembershipResponse);

  // Create, update, or delete a segment.
  rpc MutateSegment(MutateSegmentRequest) returns (MutateSegmentResponse);

  // ─── Admin CRUD ──────────────────────────────────────────────────────────

  // List all admin segments for an environment.
  rpc ListAdminSegments(ListAdminSegmentsRequest) returns (ListAdminSegmentsResponse);

  // Get a single admin segment by ID.
  rpc GetAdminSegment(GetAdminSegmentRequest) returns (AdminSegment);

  // Create a new admin segment.
  rpc CreateAdminSegment(CreateAdminSegmentRequest) returns (AdminSegment);

  // Update an existing admin segment.
  rpc UpdateAdminSegment(UpdateAdminSegmentRequest) returns (AdminSegment);

  // Delete an admin segment.
  rpc DeleteAdminSegment(DeleteAdminSegmentRequest) returns (DeleteAdminSegmentResponse);

  // Patch (add/remove/replace) entries in a list segment.
  rpc PatchSegmentEntries(PatchSegmentEntriesRequest) returns (PatchSegmentEntriesResponse);

  // Look up whether a single key is in the include/exclude list of a segment.
  rpc LookupSegmentEntry(LookupSegmentEntryRequest) returns (LookupSegmentEntryResponse);

  // Add individual entries to a list segment (Scylla-backed).
  rpc AddEntries(AddEntriesRequest) returns (AddEntriesResponse);

  // Remove individual entries from a list segment (Scylla-backed).
  rpc RemoveEntries(RemoveEntriesRequest) returns (RemoveEntriesResponse);

  // [ADDITIVE — flag_lifecycle_20260604] Activate a prepared list-segment
  // generation: atomically full-replace the include/exclude member set via the
  // ScyllaDB generation-swap. Lets a scheduled `list_generation` change fire.
  rpc ActivateListGeneration(ActivateListGenerationRequest)
      returns (ActivateListGenerationResponse);
}
