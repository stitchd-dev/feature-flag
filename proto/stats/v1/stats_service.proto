syntax = "proto3";

package stitchd.stats.v1;

// ─── Recompute Job API ────────────────────────────────────────────────────────

message TriggerRecomputeRequest {
  // UUID of the experiment to recompute stats for.
  string experiment_id = 1;
}

message TriggerRecomputeResponse {
  // UUID of the created stats job.
  string job_id    = 1;
  // Initial status — always "pending".
  string status    = 2;
  // Milliseconds since Unix epoch when the job was created.
  int64  created_at_ms = 3;
}

message GetJobStatusRequest {
  // UUID of the stats job to query.
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id         = 1;
  string status         = 2;
  // Zero when the job has not yet started.
  int64  started_at_ms  = 3;
  // Zero when the job has not yet completed.
  int64  completed_at_ms = 4;
  // Empty unless the job status is "failed".
  string error          = 5;
}

// ─── Experiment Timeseries API ────────────────────────────────────────────────

message GetExperimentTimeseriesRequest {
  // UUID of the experiment.
  string experiment_id = 1;
  // UUID of a saved metric_definitions row (Aggregation kind only).
  string metric_id     = 2;
  // Required — restricts to one of the experiment's `unit_context_types`.
  string context_type  = 3;
  // Days of history to query, default 7, clamped to [1, 90].
  uint32 days          = 4;
}

message TimeseriesBucket {
  // RFC 3339 UTC day-start (00:00 UTC).
  string day         = 1;
  // The variant the bucket aggregates over.
  string variant_key = 2;
  // Daily aggregated value (count / sum / avg / ratio / funnel rate).
  double value       = 3;
}

message GetExperimentTimeseriesResponse {
  repeated TimeseriesBucket buckets = 1;
}

// ─── StatsService ─────────────────────────────────────────────────────────────

service StatsService {
  // Trigger an out-of-band stats recompute for an experiment.
  // Returns immediately with a job_id; poll GetJobStatus to track progress.
  rpc TriggerRecompute(TriggerRecomputeRequest) returns (TriggerRecomputeResponse);

  // Query the status of a previously triggered recompute job.
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);

  // Daily per-variant aggregated series for one metric scoped to a
  // context_type. Backs the admin UI's Timeseries tab.
  rpc GetExperimentTimeseries(GetExperimentTimeseriesRequest)
      returns (GetExperimentTimeseriesResponse);
}
