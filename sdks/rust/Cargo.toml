[package]
name = "stitchd-sdk-rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Stitchd Feature Flag — server-side Rust SDK. In-process flag evaluation with polling-based definition sync and LRU-cached list-segment membership."
readme = "README.md"

[dependencies]
# Internal — the rule engine + context types we evaluate against.
stitchd-core = { path = "../../crates/stitchd-core" }
# Internal — proto-generated types for the SDK ↔ gateway wire contract.
stitchd-proto = { path = "../../crates/stitchd-proto" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Transport
tonic = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }

# Caching + lock-free snapshot swap. Enable `sync` for MembershipCache (sync
# get/insert on the evaluate() hot path) on top of the workspace-default
# `future` feature (used by auth-service's SdkKeyCache).
moka = { workspace = true, features = ["future", "sync"] }
arc-swap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Errors + observability
thiserror = { workspace = true }
tracing = { workspace = true }
# Prometheus-compatible metric emission (counters + gauges from
# `EventBuffer::enqueue` / `flush`). The host process is expected to
# install a global recorder (e.g. `metrics-exporter-prometheus`); when
# no recorder is installed the calls are no-ops, so binding the SDK to
# a specific exporter is unnecessary.
metrics = { workspace = true }

# async trait support for EventSink (boxed-future signatures)
async-trait = { workspace = true }

# Common types
uuid = { workspace = true }
chrono = { workspace = true }

[features]
# Expose test helpers (SdkClient constructor from snapshot) for integration / conformance tests.
test-util = []

[[test]]
name = "conformance"
required-features = ["test-util"]

[[test]]
name = "parity_with_preview"
required-features = ["test-util"]

[[test]]
name = "e2e_cross_context_hashing"
required-features = ["test-util"]

[[test]]
name = "exclusion_gating"
required-features = ["test-util"]

[[test]]
name = "prerequisites"
required-features = ["test-util"]

[dev-dependencies]
# Integration tests stub out the gateway with wiremock + tonic mock services.
wiremock = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
futures = { workspace = true }
serial_test = { workspace = true }
# Conformance tests build proto/core types directly from spec fixtures.
stitchd-proto = { path = "../../crates/stitchd-proto" }
stitchd-core  = { path = "../../crates/stitchd-core" }
async-trait         = { workspace = true }
uuid                = { workspace = true }
tracing-subscriber  = { workspace = true }
# In-process debugging recorder for metric assertions (Phase 5 Task 5.4).
metrics-util        = "0.20"